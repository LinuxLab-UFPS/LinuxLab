services:
  migrate:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    env_file: ./backend/.env

  init:
    image: alpine:3
    volumes:
      - ./scripts/docker:/scripts:ro
      - ssh_keys:/ssh
    entrypoint: ["/scripts/init-env.sh"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linuxlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:-linuxlab}
      POSTGRES_DB: linuxlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linuxlab"]
      interval: 5s
      timeout: 3s
      retries: 5

  entorno:
    build:
      context: ./entorno
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ssh_keys:/ssh:ro
      - entorno_home:/home

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SSH_HOST: entorno
      SSH_USER: labadmin
      SSH_KEY_PATH: /ssh/ssh_key
      JWT_SECRET: ${JWT_SECRET:-linuxlab-jwt-secret-2026}
      FRONTEND_URL: http://frontend:3000
    volumes:
      - ssh_keys:/ssh:ro

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:3000
      HOSTNAME: "0.0.0.0"

volumes:
  pgdata:
  ssh_keys:
  entorno_home:
