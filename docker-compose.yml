services:
  init:
    image: alpine:3
    volumes:
      - ./scripts/docker:/scripts:ro
      - ssh_keys:/ssh
      - ./data/auth:/auth
    entrypoint: ["/scripts/init-env.sh"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linuxlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:-linuxlab}
      POSTGRES_DB: linuxlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linuxlab"]
      interval: 5s
      timeout: 3s
      retries: 5

  entorno:
    build:
      context: ./entorno
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ssh_keys:/ssh:ro
      - entorno_home:/home
      - entorno_ssh_host:/etc/ssh
      - ./data/auth/passwd:/etc/passwd:rw
      - ./data/auth/shadow:/etc/shadow:rw
      - ./data/auth/group:/etc/group:rw
      - ./data/auth/gshadow:/etc/gshadow:rw

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SSH_HOST: entorno
      SSH_USER: labadmin
      SSH_KEY_PATH: /ssh/ssh_key
      JWT_SECRET: ${JWT_SECRET:-linuxlab-jwt-secret-2026}
      FRONTEND_URL: http://frontend:3000
    volumes:
      - ssh_keys:/ssh:ro

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:3000
      # Docker auto-sets HOSTNAME to the container ID; Next's standalone
      # server.js reads that var to decide what address to bind/listen on and
      # tries to resolve it as a real hostname, which fails. Force it to bind
      # on all interfaces instead.
      HOSTNAME: "0.0.0.0"

volumes:
  pgdata:
  ssh_keys:
  entorno_home:
  entorno_ssh_host:
