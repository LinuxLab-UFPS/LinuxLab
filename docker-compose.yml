services:
  migrate:
    build:
      context: ./backend
    networks:
      - internal
      - external
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    env_file: ./backend/.env

  init:
    image: alpine:3
    volumes:
      - ./scripts/docker:/scripts:ro
      - ssh_keys:/ssh
    entrypoint: ["/scripts/init-env.sh"]

  postgres:
    image: postgres:16-alpine
    mem_limit: 256m
    cpu_shares: 1024
    # Solo la red interna: la base no se alcanza desde fuera ni publica puertos.
    # Su unico cliente es el backend, que si esta en las dos redes.
    networks:
      - internal
    environment:
      POSTGRES_USER: linuxlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:-linuxlab}
      POSTGRES_DB: linuxlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linuxlab"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  entorno:
    build:
      context: ./entorno
    hostname: linuxlab
    # El servidor concede 1 GB al proyecto completo. El entorno se lleva la mitad
    # porque es el unico que crece con la gente conectada: 28 MB en reposo y unos
    # 10 MB por estudiante con vim abierto, o sea ~48 simultaneos. Los demas
    # contenedores consumen lo mismo con uno o con cien.
    mem_limit: 512m
    # Techo de CPU del laboratorio: medio nucleo. Un `while true` de un
    # estudiante no puede degradar al backend ni al frontend. Dentro del
    # laboratorio, el cgroup por usuario (10%) y el ulimit -u 16 reparten.
    cpus: 0.5
    cpu_shares: 512
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ssh_keys:/ssh:ro
      - entorno_home:/home
      - entorno_etc:/var/lib/linuxlab
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    mem_limit: 256m
    cpu_shares: 1024
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SSH_HOST: entorno
      SSH_USER: labadmin
      SSH_KEY_PATH: /ssh/ssh_key
      JWT_SECRET: ${JWT_SECRET:-linuxlab-jwt-secret-2026}
      FRONTEND_URL: http://frontend:3000
    volumes:
      - ssh_keys:/ssh:ro
    networks:
      - internal
      - external
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    mem_limit: 128m
    cpu_shares: 256
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:3000
      # El navegador entra por el puerto publicado; el servidor de Next habla
      # con el backend por la red interna.
      BACKEND_URL: http://backend:3000
      HOSTNAME: "0.0.0.0"
    networks:
      - external
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    internal: true
  external:
    internal: false

volumes:
  pgdata:
  ssh_keys:
  entorno_home:
  entorno_etc:
