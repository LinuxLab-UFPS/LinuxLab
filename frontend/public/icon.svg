<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    LinuxLab: una ventana de terminal con las dos eles de la marca.

    Va oscuro en los dos temas a proposito: una terminal es oscura, y un icono
    que cambia de fondo deja de reconocerse de un vistazo. El borde tenue es lo
    que evita que se funda con la barra del navegador en tema oscuro.

    Las eles son rectas y sin redondeos, con el mismo grosor de trazo (8) que la
    rejilla: a 16 px lo que sobrevive es la silueta, y los redondeos ahi solo
    ensucian. Todas las medidas son multiplos de 2 para que caigan en pixel
    entero al rasterizar a 32 y a 16.
  -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A" />

  <!-- Barra de titulo con sus tres botones: es lo que dice "terminal". -->
  <path d="M14 0H50C57.732 0 64 6.26801 64 14H0C0 6.26801 6.26801 0 14 0Z" fill="#16181D" />
  <circle cx="9" cy="7" r="2" fill="#C41E3A" />
  <circle cx="16" cy="7" r="2" fill="#2E323B" />
  <circle cx="23" cy="7" r="2" fill="#2E323B" />

  <!-- L roja: el rojo de la marca. -->
  <path d="M15 22H23V42H29V50H15Z" fill="#C41E3A" />
  <!-- L blanca. -->
  <path d="M35 22H43V42H49V50H35Z" fill="#FFFFFF" />

  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.14" />
</svg>
