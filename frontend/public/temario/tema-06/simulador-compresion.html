<!doctype html>
<title>Escritorio comprimido · LinuxLab</title>
<link rel="stylesheet" href="/temario/comun/barra.css">
<script src="/temario/comun/barra.js"></script>
<style>
:root {
  --bg:     #0D1117;
  --surf:   #161B22;
  --surf2:  #1C2128;
  --border: #21262D;
  --red:    #FF0030;
  --green:  #2ECC71;
  --blue:   #58A6FF;
  --text:   #C9D1D9;
  --bright: #F0F6FC;
  --muted:  #6B8399;
  --dim:    #21262D;
  --gold:   #FFC400;
  --mono:'SF Mono','Fira Mono','Cascadia Mono',Consolas,'Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:var(--bg);overflow:hidden}
/* Mismo escalado que los demas simuladores: el cuerpo se maqueta a 1/1.3 del
   viewport y se amplia despues. Sin esto, este se veia notablemente mas
   pequeno que el de permisos o el de vi puestos uno al lado del otro. */
body{
  display:flex;flex-direction:column;
  color:var(--text);font-family:var(--mono);overflow:hidden;
  width:calc(100vw / 1.3);height:calc(100vh / 1.3);
  transform:scale(1.3);transform-origin:0 0;
  background:var(--bg);position:relative;
}

/* La cabecera vive en /temario/comun/barra.css */

/* ---------- escritorio ----------
   Los planos inclinados son tres degradados sobre un fondo plano: da la
   sensacion de fondo de escritorio sin cargar ninguna imagen. */
.desk{
  position:relative;flex:1;min-height:0;overflow:hidden;
  background:
    linear-gradient(158deg,transparent 54%,rgba(163,113,247,.24) 54.2%),
    linear-gradient(202deg,transparent 70%,rgba(120,80,200,.18) 70.2%),
    linear-gradient(130deg,#1B1030 0%,#2E1550 47%,#45208A 100%);
}

/* ---------- iconos del escritorio ---------- */
/* La tira llega hasta la terminal y los iconos son mas estrechos: asi la
   descarga del cuarto desafio aparece en el hueco libre de la derecha en vez
   de caerse de la lista por falta de sitio. */
.icons{position:absolute;left:3%;top:4%;width:40%;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
.icon{width:clamp(76px,8.4vmin,92px);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.icon-art{width:clamp(34px,4.8vmin,54px);height:clamp(34px,4.8vmin,54px)}
.icon-art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.icon-name{font-size:clamp(8.5px,1vmin + 2px,10.5px);color:var(--bright);word-break:break-all;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.icon-size{font-size:clamp(8px,0.95vmin + 2px,10px);color:#B9C6D6;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ---------- ventanas ---------- */
.win{
  position:absolute;background:var(--surf);border:1px solid var(--border);
  border-radius:9px;overflow:hidden;display:flex;flex-direction:column;min-width:0;
  box-shadow:0 18px 40px rgba(0,0,0,.5);
}
.win[hidden]{display:none}
.win-bar{display:flex;align-items:center;gap:7px;padding:0.9vmin 1.3vmin;background:var(--surf2);border-bottom:1px solid var(--border);flex-shrink:0}
.win-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
/* El punto de minimizar es el unico que hace algo; el guion aparece al pasar
   por encima, como en cualquier escritorio. */
button.win-dot{border:none;padding:0;font:inherit;cursor:pointer;position:relative}
button.win-dot::after{
  content:"";position:absolute;left:2.5px;right:2.5px;top:5px;height:1.5px;
  background:rgba(0,0,0,.55);border-radius:1px;opacity:0;transition:opacity .15s;
}
.win-bar:hover button.win-dot::after{opacity:1}

/* Cada ventana en su cuadrante: arriba izquierda los desafios, arriba derecha
   la terminal, abajo derecha el correo. Abrir y cerrar no las mueve de sitio. */
#w-term{left:44%;top:7%;width:53%;height:77%}
.console{background:#0B0E14;padding:1.4vmin 1.6vmin;font-size:clamp(9.5px,1.25vmin + 3px,13px);flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.log{white-space:pre-wrap;line-height:1.5}
.log.ok{color:var(--green)}
.log.bad{color:var(--red)}
.log.note{color:var(--muted)}
.log.echo{color:var(--text)}
/* El prompt vive dentro de la consola y detras de la ultima linea: es donde
   lo pone una terminal. Como fila aparte quedaba clavado abajo, con la
   salida arriba y un hueco en medio. */
.prompt{display:flex;align-items:center;gap:7px;font-size:clamp(10px,1.3vmin + 3px,13.5px);flex-shrink:0}
.ps1{color:var(--green);font-weight:700;flex-shrink:0}
.typed{color:var(--bright);white-space:pre}
.caret{display:inline-block;width:8px;height:15px;background:var(--bright);animation:blink 1.05s step-end infinite;vertical-align:-3px}
@keyframes blink{50%{opacity:0}}

#w-txt{left:3%;top:50%;width:34%;height:39%}
/* Aspecto de editor: canaleta con numeros y la linea activa resaltada. Se
   distingue de un vistazo del correo, que es papel blanco, y el estudiante sabe
   cual de las dos esta mirando sin leer el titulo. */
.txt-body{
  background:#1E222A;color:var(--text);flex:1;min-height:0;overflow-y:auto;
  padding:9px 0;font-size:clamp(9.5px,1.2vmin + 3px,13px);line-height:1.55;
}
.gutter{display:grid;grid-template-columns:clamp(24px,3.2vmin,36px) 1fr;gap:11px;padding-right:13px}
.txt-titulo{color:var(--muted);padding-bottom:9px;border-bottom:1px solid #2A2F3A;margin-bottom:8px}
.txt-titulo::before{content:"#";text-align:right;color:#3E4552}
.linea{padding:6px 0 6px 0;border-left:2px solid transparent;transition:background .3s}
.linea .ln{text-align:right;color:#3E4552;user-select:none}
.linea.cur{background:rgba(255,255,255,.05);border-left-color:var(--green)}
.linea.cur .ln{color:var(--green)}
.linea.cur .paso-t{color:var(--bright)}
.linea.pend{opacity:.42}
.linea.done{opacity:.6}
.linea.done .paso-t{text-decoration:line-through;text-decoration-color:var(--green);color:var(--green)}
.txt-nota{margin-top:16px;padding-top:11px;border-top:1px solid #E3E3EA;font-size:11px;color:#70707E;line-height:1.5}

#w-mail{left:3%;top:20%;width:34%;height:30%}
.mail-body{background:#FBFBFD;color:#1A1A1F;flex:1;min-height:0;display:flex;flex-direction:column;padding:1.2vmin 1.6vmin;font-size:clamp(9.5px,1.15vmin + 3px,12.5px);gap:0}
.mail-row{display:flex;gap:8px;padding:5px 2px;border-bottom:1px solid #E8E8EE;color:#55555F}
.mail-row b{color:#1A1A1F;font-weight:600}
/* Sin scroll: lo que hay que ver aqui son tres cosas —el adjunto, el limite y
   el aviso cuando algo no cuadra— y las tres caben. Con una barra, el aviso
   que explica por que no se puede enviar acababa fuera de la vista, que es
   justo cuando hace falta leerlo. */
.mail-adj{flex:1;min-height:0;overflow:hidden;padding:9px 2px;display:flex;flex-direction:column;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;background:#EEF1F6;border:1px solid #D8DDE6;border-radius:5px;padding:5px 10px;font-size:11.5px;color:#1A1A1F}
.chip.malo{background:#FDECEE;border-color:#F5C2C7;color:#A3111F}

/* ---------- TUBO: el launcher del juego ----------
   Comparte cuadrante con el correo (cada uno sirve a un desafio distinto y
   abrir uno cierra el otro), pero mas alto: le pisa un poco los objetivos a
   proposito, porque todo lo suyo tiene que verse de una sin desplazar nada.
   El marco es el del sistema, como cualquier ventana del escritorio; el rojo
   empieza dentro, que es donde empieza el programa. */
#w-game{left:3%;top:20%;width:40%;height:46%}
/* Sin scroll: lo que no cabe se arregla encogiendo la tipografia, no
   escondiendo media ventana detras de una barra. */
.game-body{background:#140A0D;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}

/* Cabecera de la aplicacion: el logo de la valvula y la marca. */
.tubo-hdr{display:flex;align-items:center;gap:9px;padding:7px 11px;background:linear-gradient(90deg,#A8132F,#C41E3A 60%,#8E1329);flex-shrink:0}
.tubo-logo{width:clamp(20px,2.4vmin,26px);height:clamp(20px,2.4vmin,26px);flex-shrink:0}
.tubo-marca{font-size:clamp(13px,1.6vmin + 4px,18px);font-weight:800;color:#fff;letter-spacing:.11em}

.tubo-main{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.05fr);gap:clamp(10px,1.4vmin,16px);padding:clamp(10px,1.4vmin,15px);align-content:start}
.tubo-izq{display:flex;flex-direction:column;gap:9px;min-width:0}
.tubo-info{min-width:0}
.game-art{width:clamp(84px,10vmin,108px);height:clamp(84px,10vmin,108px);border-radius:4px;background:#1B1FA0;display:grid;place-items:center;flex-shrink:0}
.game-art svg{width:74%;height:74%}
.game-name{font-size:clamp(13px,1.7vmin + 4px,19px);color:#fff;font-weight:700;line-height:1.15;text-transform:uppercase}
.game-dir-t{font-size:clamp(9px,1.05vmin + 2px,11.5px);color:#C9AEB4;margin:9px 0 5px}
.game-ruta{display:flex;align-items:center;gap:8px;min-width:0}
.game-ruta code{flex:1;min-width:0;font-size:clamp(9px,1.05vmin + 2px,11.5px);color:#F3D9DE;overflow-x:auto;white-space:nowrap}
.game-copiar{flex-shrink:0;background:#3A1B22;border:1px solid #55262F;color:#E8CDD3;border-radius:4px;padding:4px 10px;font-size:10.5px;cursor:pointer;font-family:inherit}
.game-copiar:hover{background:#4C242D;color:#fff}

/* Play abajo del todo, en su propia franja: asi no lo recorta el alto de la
   columna de la izquierda pase lo que pase con el resto del contenido. */
.tubo-pie{flex-shrink:0;padding:0 clamp(10px,1.4vmin,15px) clamp(10px,1.4vmin,15px)}
/* Gris mientras la instalacion no este completa. El verde llega solo cuando
   de verdad se puede jugar, y por eso se ve venir. */
.game-play{width:clamp(112px,15vmin,158px);display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:4px;padding:8px 10px;font-size:clamp(11px,1.25vmin + 3px,14px);font-weight:700;font-family:inherit;background:#8C8F96;color:#26282D;cursor:not-allowed}
.game-play.listo{background:#2FBF71;color:#06210F;cursor:pointer}
.game-play.listo:hover{background:#41D585}
.game-play svg{width:1em;height:1em}

/* Comunidad: la excusa para que alguien "suba" el mod. El primer post es el
   que trae el enlace; los otros dos son ruido de foro. */
.tubo-com{display:flex;flex-direction:column;gap:7px;min-width:0}
.com-t{font-size:clamp(9.5px,1.1vmin + 2px,12px);color:#D8C2C7;margin-bottom:1px}
.com-post{display:flex;align-items:center;gap:8px;background:#2A121A;border:1px solid #43202A;border-radius:4px;padding:7px 9px;font-size:clamp(9px,1.02vmin + 2px,11px);color:#8C6F76;min-width:0}
.com-post.top{background:#5E0F22;border-color:#8A1A31;color:#FFE6EA;font-weight:700}
.com-post span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.com-baja{flex-shrink:0;width:22px;height:22px;display:grid;place-items:center;background:#C41E3A;border:none;border-radius:4px;cursor:pointer;padding:0}
.com-baja:hover{background:#E23050}
.com-baja svg{width:13px;height:13px}
.com-baja[disabled]{background:#3F1A24;cursor:default}

/* Cazador de pegados: fuera de la vista pero enfocable, porque el evento
   `paste` solo se dispara sobre algo editable. La terminal de aqui no es un
   campo de texto —las teclas se leen del documento—, asi que sin esto Ctrl+V
   no llega a ninguna parte. */
.pegar{position:fixed;top:-300px;left:-300px;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none}
.mail-vacio{font-size:11.5px;color:#9A9AA6}
.mail-aviso{font-size:11.5px;color:#A3111F;line-height:1.45}
.mail-pie{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid #E8E8EE}
.btn-mail{border:none;border-radius:5px;padding:7px 15px;font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;background:#1A73E8;color:#fff}
.btn-mail.sec{background:#EEF1F6;color:#1A1A1F;border:1px solid #D8DDE6;font-weight:400}
.btn-mail:disabled{opacity:.4;cursor:not-allowed}
/* Los iconos que no hacen nada se ven apagados a proposito: asi no se intenta
   usarlos y se entiende que el correo solo sirve para adjuntar y enviar. */
.mail-inertes{display:flex;gap:13px;margin-left:auto;opacity:.28;pointer-events:none}
.mail-inertes svg{width:17px;height:17px;display:block}

/* elegir adjunto */
.picker{position:absolute;inset:0;background:rgba(10,12,18,.55);display:flex;align-items:center;justify-content:center;z-index:20}
.picker[hidden]{display:none}
.picker-box{background:#FBFBFD;color:#1A1A1F;border-radius:8px;width:280px;max-height:220px;overflow-y:auto;padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.picker-t{font-size:11px;color:#70707E;padding:4px 6px 8px}
.picker-it{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:none;text-align:left;font-family:var(--mono);font-size:12px;padding:7px 6px;border-radius:5px;cursor:pointer;color:#1A1A1F}
.picker-it:hover{background:#EEF1F6}
.picker-it small{color:#8A8A99}

/* ---------- marca de agua ---------- */
/* El guiño: vive en el cuadrante de la terminal, detras de ella. */
.marca{
  position:absolute;left:44%;top:7%;width:53%;height:77%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(26px,5.2vmin,54px);font-weight:700;letter-spacing:.04em;
  color:var(--red);filter:drop-shadow(0 0 24px rgba(255,0,48,.5));
  user-select:none;pointer-events:none;
}
.marca span{color:var(--bright);filter:none}

/* ---------- dock ---------- */
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:12px;padding:9px 14px;background:rgba(22,27,34,.86);border:1px solid var(--border);border-radius:14px;backdrop-filter:blur(6px)}
.dock-btn{width:clamp(36px,5.2vmin,52px);height:clamp(36px,5.2vmin,52px);border:none;background:none;padding:0;cursor:pointer;position:relative;transition:transform .15s}
.dock-btn:hover{transform:translateY(-4px)}
.dock-btn:disabled{cursor:default}
.dock-btn:disabled:hover{transform:none}
.dock-btn[data-abierta="true"]::after{content:"";position:absolute;bottom:-7px;left:22%;width:56%;height:3px;border-radius:2px;background:#E8912F}
.dock-btn svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 9px rgba(0,0,0,.5))}

/* Poco sitio (pantalla pequeña o zoom fuerte): en vez de encoger las ventanas
   hasta que no quepa nada, se apilan con un alto minimo util y el escritorio se
   desplaza. Vale mas hacer scroll que leer una terminal de tres lineas.
   Va al final y con selectores de ID a proposito: un `#w-term` de arriba le
   ganaria a un `.win` de aqui por especificidad. */
@media (max-width:860px), (max-height:520px){
  .desk{display:block;overflow-y:auto;padding:14px 14px 96px}
  .icons{position:static;width:auto;margin-bottom:14px}
  .marca{display:none}
  #w-term,#w-txt,#w-mail,#w-game{
    position:static;left:auto;right:auto;top:auto;width:auto;margin-bottom:13px;
  }
  #w-term{height:min(300px,52vh);min-height:210px}
  #w-txt{height:auto;min-height:190px}
  #w-mail{height:auto;min-height:220px}
  #w-game{height:auto;min-height:200px}
  .dock{position:fixed;bottom:12px}
}
</style>

<!-- La barra la arma barra.js. -->
<div class="hdr"></div>

<div class="desk" id="desk">
  <div class="icons" id="icons"></div>

  <!-- Debajo de la terminal, para quien se le ocurra cerrarla. -->
  <div class="marca" aria-hidden="true">Linux<span>Lab</span></div>

  <!-- terminal: no se cierra, es donde se trabaja -->
  <div class="win" id="w-term">
    <div class="win-bar">
      <span class="win-dot" style="background:#FF5F56"></span>
      <button class="win-dot min" style="background:#FFBD2E" data-win="w-term" data-dock="d-term" title="Minimizar" aria-label="Minimizar"></button>
      <span class="win-dot" style="background:#27C93F"></span>
    </div>
    <div class="console" id="consola">
      <div class="prompt">
        <span class="ps1" id="ps1">$</span>
        <span><span class="typed" id="typed"></span><span class="caret"></span></span>
      </div>
    </div>
  </div>

  <!-- instrucciones -->
  <div class="win" id="w-txt">
    <div class="win-bar">
      <span class="win-dot" style="background:#FF5F56"></span>
      <button class="win-dot min" style="background:#FFBD2E" data-win="w-txt" data-dock="d-txt" title="Minimizar" aria-label="Minimizar"></button>
      <span class="win-dot" style="background:#27C93F"></span>
    </div>
    <div class="txt-body" id="pasos"></div>
  </div>

  <!-- correo -->
  <div class="win" id="w-mail" hidden>
    <div class="win-bar">
      <span class="win-dot" style="background:#FF5F56"></span>
      <button class="win-dot min" style="background:#FFBD2E" data-win="w-mail" data-dock="d-mail" title="Minimizar" aria-label="Minimizar"></button>
      <span class="win-dot" style="background:#27C93F"></span>
    </div>
    <div class="mail-body">
      <div class="mail-row"><b>Para:</b> coordinacion@linuxlab.edu</div>
      <div class="mail-adj" id="mail-adj"></div>
      <div class="mail-pie">
        <button class="btn-mail" id="mail-enviar">Enviar</button>
        <button class="btn-mail sec" id="mail-adjuntar">Adjuntar</button>
        <span class="mail-inertes" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1A1A1F" stroke-width="1.6" stroke-linecap="round"><path d="M8 6h8M12 6v12M9 18h6"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#1A1A1F" stroke-width="1.6" stroke-linecap="round"><path d="M10 13.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 1 0-5-5L11 7.5"/><path d="M14 10.5a3.5 3.5 0 0 0-5 0L6.5 13a3.5 3.5 0 1 0 5 5l1.5-1.5"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#1A1A1F" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="m5 16 4.5-4.5L13 15l3-2.5 3 3"/></svg>
        </span>
      </div>
    </div>
  </div>

  <!-- TUBO: el launcher del cuarto desafio. La barra es la del sistema, sin
       titulo: la marca va dentro, en la cabecera de la propia aplicacion. -->
  <div class="win" id="w-game" hidden>
    <div class="win-bar">
      <span class="win-dot" style="background:#FF5F56"></span>
      <button class="win-dot min" style="background:#FFBD2E" data-win="w-game" data-dock="d-game" title="Minimizar" aria-label="Minimizar"></button>
      <span class="win-dot" style="background:#27C93F"></span>
    </div>
    <div class="game-body" id="game-body"></div>
  </div>

  <textarea id="pegar" class="pegar" aria-hidden="true" tabindex="-1"></textarea>

  <div class="picker" id="picker" hidden>
    <div class="picker-box">
      <div class="picker-t">Elige un archivo de ~/escritorio</div>
      <div id="picker-lista"></div>
    </div>
  </div>

  <div class="dock">
    <button class="dock-btn" id="d-mail" title="Correo">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" rx="15" fill="#2FB0F0"/>
        <rect x="13" y="21" width="38" height="24" rx="3" fill="#fff"/>
        <path d="M14 23.5 32 36l18-12.5" fill="none" stroke="#2FB0F0" stroke-width="3.4" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="dock-btn" id="d-txt" title="Desafíos" data-abierta="true">
      <svg viewBox="0 0 64 64">
        <rect x="9" y="5" width="46" height="54" rx="5" fill="#F7FAFF"/>
        <rect x="9" y="5" width="46" height="9" rx="4.5" fill="#3E7FC1"/>
        <path d="M19 25h26M19 33h26M19 41h17" stroke="#7FA6CC" stroke-width="3.2" stroke-linecap="round"/>
        <rect x="9" y="52" width="46" height="7" rx="3.5" fill="#E8912F"/>
      </svg>
    </button>
    <!-- TUBO: el chiste es la valvula. Steam es de Valve, y esto es Steam del
         reves, asi que su logo es una valvula de compuerta sobre el rojo de la
         plataforma apagandose en negro. -->
    <button class="dock-btn" id="d-game" title="TUBO">
      <svg viewBox="0 0 64 64">
        <defs>
          <radialGradient id="tubo-dock" cx="34%" cy="26%" r="86%">
            <stop offset="0%" stop-color="#E23050"/>
            <stop offset="46%" stop-color="#A81530"/>
            <stop offset="100%" stop-color="#0A0708"/>
          </radialGradient>
        </defs>
        <circle cx="32" cy="32" r="32" fill="url(#tubo-dock)"/>

  <h2>Escritorio comprimido</h2>
  <p>
    Un escritorio con una terminal y un correo que no admite carpetas.
    Empaqueta con tar, mira dentro de un respaldo antes de abrirlo y envía la
    entrega sin lo que no debía salir.
  </p>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// Sin puntos: aqui no se puntua, se completa la entrega. Reiniciar vuelve a
// la portada, que es de donde arranca la partida.
const barra = Barra.montar({ puntos: false, onReiniciar: () => reiniciar() });

/* ============================================================
   ICONOS
   Trazo plano, del mismo grosor y con la paleta de la plataforma. Los emoji
   dependian de la fuente del sistema y cada maquina los dibujaba distinto.
   ============================================================ */
const SVG = {
  carpeta:
    '<svg viewBox="0 0 64 64">' +
    '<path d="M5 13a4 4 0 0 1 4-4h15.5l5 6H55a4 4 0 0 1 4 4v5H5z" fill="#C98A2E"/>' +
    '<path d="M5 22h54a4 4 0 0 1 4 4.4l-3.4 24A5 5 0 0 1 54.7 55H9.3a5 5 0 0 1-5-4.6L1 26.4A4 4 0 0 1 5 22z" fill="#F0B454"/>' +
    "</svg>",
  paquete:
    '<svg viewBox="0 0 64 64">' +
    '<path d="M16 5h22l14 14v36a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z" fill="#4C8DF6"/>' +
    '<path d="M38 5l14 14H41a3 3 0 0 1-3-3z" fill="#A8C6FA"/>' +
    '<rect x="27" y="19" width="10" height="28" rx="2" fill="#EAF1FE"/>' +
    '<path d="M30 24h4M30 30h4M30 36h4" stroke="#4C8DF6" stroke-width="2.6" stroke-linecap="round"/>' +
    "</svg>",
};

/* ============================================================
   NOMBRES
   Cambian en cada partida para que no se memorice la respuesta,
   igual que el reparto al azar de la actividad del logo. El orden
   de los desafios NO cambia: se encadenan.
   ============================================================ */
const CARPETAS = ["informe", "practica", "entrega", "proyecto"];
const SUELTOS  = ["notas", "borrador", "resumen", "apuntes"];
const RESPALDOS = ["respaldo", "copia", "historico"];
const INTRUSOS = ["clave.txt", "password.txt", "token.txt"];
const JUEGOS = [
  { titulo: "Starforge", carpeta: "starforge" },
  { titulo: "Neon Rift", carpeta: "neonrift" },
  { titulo: "Duskfall", carpeta: "duskfall" },
];
const PACKS = ["pack-invierno", "pack-armas", "pack-texturas"];

const alAzar = (xs) => xs[Math.floor(Math.random() * xs.length)];

/** Tamaños en bytes; se muestran con la unidad que les toque. */
function tam(bytes) {
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
  if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
  return bytes + " B";
}

/** Lo que encoge un tar.gz de texto. No es exacto ni pretende serlo: es
 *  el orden de magnitud que el estudiante vera en un `ls -l` de verdad. */
const RATIO = 0.27;

/* ============================================================
   ESTADO
   ============================================================ */
let fs, nombres, paso, enviado, descargado, jugado;

function nuevaPartida() {
  const juego = alAzar(JUEGOS);
  nombres = {
    carpeta: alAzar(CARPETAS),
    respaldo: alAzar(RESPALDOS) + ".tar.gz",
    intruso: alAzar(INTRUSOS),
    suelto: alAzar(SUELTOS) + ".txt",
    juego: juego.titulo,
    // Un solo nivel: el modelo del sistema de archivos no anida mas.
    mods: juego.carpeta + "-mods",
    pack: alAzar(PACKS) + ".tar.gz",
  };

  const hojas = ["datos.csv", "lectura.md", nombres.suelto];
  fs = {};
  // La carpeta del desafio 1, con su peso repartido entre los archivos.
  fs[nombres.carpeta] = { tipo: "dir", hijos: hojas.slice(), bytes: 1_200_000 };
  hojas.forEach((h, i) => {
    fs[nombres.carpeta + "/" + h] = { tipo: "file", bytes: [520_000, 410_000, 270_000][i] };
  });
  // El respaldo del desafio 2 ya viene comprimido. Lleva dentro una carpeta,
  // como cualquier tar de verdad: extraerlo deja un directorio, no un puñado
  // de archivos sueltos por el sitio.
  nombres.raizRespaldo = nombres.respaldo.replace(".tar.gz", "");
  fs[nombres.respaldo] = {
    tipo: "file",
    bytes: 240_000,
    raiz: nombres.raizRespaldo,
    dentro: ["config.yml", "registro.log", nombres.intruso],
    pesos: { "config.yml": 140_000, "registro.log": 520_000, [nombres.intruso]: 90_000 },
  };

  // La carpeta de mods del juego existe desde el principio: la crea el
  // launcher al instalarse, como cualquier juego. Vacia, esperando el pack.
  fs[nombres.mods] = { tipo: "dir", hijos: [], bytes: 0 };

  cwd = "";
  paso = 0;
  enviado = null;
  descargado = false;
  jugado = false;
}

/** Lo que hay en la raiz de ~/escritorio (no las hojas de las carpetas). */
const enRaiz = () => Object.keys(fs).filter((k) => !k.includes("/"));

/**
 * Donde esta parado el estudiante, relativo a ~/escritorio ("" es la raiz).
 *
 * Antes `cd` estaba capado y era lo mas antinatural del simulador: es el
 * primer comando que aprende cualquiera y el unico que aqui no funcionaba.
 * Ahora se mueve de verdad, y tiene que fijarse desde donde comprime o
 * extrae, que es exactamente la leccion que enseña.
 */
let cwd = "";

/**
 * Traduce lo que se escribe a una clave del sistema de archivos.
 * Devuelve null si apunta fuera del escritorio, "" para la raiz.
 */
function resolver(ruta) {
  const texto = (ruta || "").trim();
  if (!texto) return cwd;
  if (texto === "~" || texto === "~/escritorio") return "";

  let partes;
  if (texto.startsWith("~/escritorio/")) partes = texto.slice(13).split("/");
  else if (texto.startsWith("~/")) partes = texto.slice(2).split("/");
  else if (texto.startsWith("/")) return null;
  else partes = (cwd ? cwd.split("/") : []).concat(texto.split("/"));

  const pila = [];
  for (const p of partes) {
    if (!p || p === ".") continue;
    if (p === "..") { pila.pop(); continue; }
    pila.push(p);
  }
  return pila.join("/");
}

/** El prompt dice donde estas, como en cualquier terminal. */
function pintarPrompt() {
  const ps1 = $("ps1");
  if (ps1) ps1.textContent = "~/escritorio" + (cwd ? "/" + cwd : "") + " $";
}

/** Ruta que enseña el launcher, tal cual se puede pegar en la terminal. */
const rutaMods = () => "~/escritorio/" + nombres.mods;

/** Los .mod que trae el pack, sin el leeme: son los que cuentan como instalados. */
const MODS = ["arma-legendaria.mod", "texturas-hd.mod"];

/** El pack esta extraido en la carpeta de mods del juego. */
const modsInstalados = () => {
  const d = fs[nombres.mods];
  return Boolean(d && MODS.every((m) => d.hijos.includes(m)));
};

/** Listo para jugar: los mods puestos y el paquete ya no anda por ahi. */
const listoParaJugar = () => modsInstalados() && !fs[nombres.pack];

/* ============================================================
   DESAFIOS
   Cada uno sabe cuando esta hecho mirando el estado, no vigilando
   comandos: asi cualquier camino valido cuenta, tambien el que no
   se nos ocurrio.
   ============================================================ */
function desafios() {
  return [
    {
      objetivo: `Comprime ${nombres.carpeta}/ en un .tar.gz`,
      texto: `Comprime la carpeta ${nombres.carpeta}/ en un .tar.gz con tar. El correo no admite carpetas.`,
      hecho: () =>
        Object.keys(fs).some((n) => n.endsWith(".tar.gz") && fs[n].deLaCarpeta === nombres.carpeta),
    },
    {
      objetivo: `Lista y extrae ${nombres.respaldo}`,
      texto: `Lista el contenido de ${nombres.respaldo} antes de abrirlo y extráelo.`,
      hecho: () => Boolean(fs[nombres.respaldo] && fs[nombres.respaldo].extraido),
    },
    {
      objetivo: `Elimina ${nombres.intruso}, recomprime y envía`,
      texto: `Elimina ${nombres.intruso}, vuelve a comprimir ${nombres.raizRespaldo}/ y envíalo por correo.`,
      hecho: () => Boolean(enviado && enviado.limpio),
    },
    {
      objetivo: `Instala los mods de ${nombres.juego} y juega`,
      // Sin el paso a paso: el launcher ya dice cual es el directorio y por que
      // no arranca. Contarlo todo aqui convierte el desafio en un dictado.
      texto:
        `Abre el launcher TUBO y deja sus mods instalados en el directorio del ` +
        `juego para poder jugar.`,
      hecho: () => jugado,
    },
  ];
}

/* ============================================================
   SHELL
   Juego de comandos acotado a proposito, y anunciado en pantalla:
   un simulador que acepta a medias una bandera miente mas de lo
   que ensena.
   ============================================================ */
function log(texto, clase) {
  const d = document.createElement("div");
  d.className = "log" + (clase ? " " + clase : "");
  d.textContent = texto;
  const c = $("consola");
  const prompt = c.querySelector(".prompt");
  if (prompt) c.insertBefore(d, prompt); else c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

const AYUDA = [
  "Comandos disponibles en esta práctica:",
  "  cd <carpeta>               entra en una carpeta (.. sube, ~ vuelve)",
  "  ls [-l] [carpeta]          lista lo que hay",
  "  tar -czf <salida> <origen> empaqueta y comprime",
  "  tar -tzf <archivo>         lista el contenido sin extraer",
  "  tar -xzf <archivo>         extrae",
  "  tar -xzf <archivo> -C <carpeta>  extrae dentro de esa carpeta",
  "  rm [-r] <ruta>             borra",
  "  clear                      limpia la consola",
];

/** `cd`: moverse de verdad, con `..` y `~` como en cualquier shell. */
function cmdCd(args) {
  const donde = args.find((a) => !a.startsWith("-"));
  const clave = resolver(donde === undefined ? "~" : donde);
  if (clave === null) return log(`cd: ${donde}: en esta práctica solo existe ~/escritorio`, "bad");
  if (clave !== "") {
    const e = fs[clave];
    if (!e) return log(`cd: ${donde}: no existe`, "bad");
    if (e.tipo !== "dir") return log(`cd: ${donde}: no es un directorio`, "bad");
  }
  cwd = clave;
  pintarPrompt();
}

function cmdLs(args) {
  const largo = args.includes("-l");
  const donde = args.find((a) => !a.startsWith("-"));
  const clave = resolver(donde);
  if (clave === null) return log(`ls: ${donde}: en esta práctica solo existe ~/escritorio`, "bad");

  // Sin argumento lista donde estas; con uno, esa carpeta.
  if (clave !== "" && !fs[clave]) return log(`ls: ${donde}: no existe`, "bad");
  if (clave !== "" && fs[clave].tipo !== "dir") return log(donde, "echo");

  const hijos = clave === "" ? enRaiz() : fs[clave].hijos.slice();
  if (hijos.length === 0) return log("(vacío)", "note");
  hijos.sort().forEach((n) => {
    const e = fs[clave ? clave + "/" + n : n];
    const marca = e && e.tipo === "dir" ? "/" : "";
    const peso = e ? e.bytes : 0;
    log(largo ? `${tam(peso).padStart(8)}  ${n}${marca}` : `${n}${marca}`, "echo");
  });
}

function cmdTar(args) {
  // `-C <carpeta>` se saca antes de nada: su valor no es un origen ni el
  // paquete, y si se quedara en la lista se leeria como uno de los dos.
  let destino = null;
  const iC = args.indexOf("-C");
  if (iC !== -1) {
    const escrito = args[iC + 1];
    args = args.slice(0, iC).concat(args.slice(iC + 2));
    if (!escrito) return log("tar: -C necesita una carpeta", "bad");
    destino = resolver(escrito);
    if (destino === null) return log(`tar: ${escrito}: en esta práctica solo existe ~/escritorio`, "bad");
  }

  const bandera = args.find((a) => a.startsWith("-"));
  if (!bandera) return log("tar: falta la operación (-czf, -tzf o -xzf)", "bad");
  const resto = args.filter((a) => !a.startsWith("-"));

  if (bandera.includes("c")) {
    if (!bandera.includes("z")) return log("tar: sin -z el archivo no queda comprimido", "bad");
    const nombreSalida = resto[0];
    if (!nombreSalida || resto.length < 2)
      return log("tar: uso: tar -czf <salida.tar.gz> <origen>", "bad");
    if (!nombreSalida.endsWith(".tar.gz") && !nombreSalida.endsWith(".tgz"))
      return log("tar: el nombre de salida debería terminar en .tar.gz", "bad");
    // El paquete nace donde estas parado, no siempre en la raiz.
    const salida = resolver(nombreSalida);
    const origenes = resto.slice(1).map(resolver);
    if (salida === null || origenes.some((o) => o === null))
      return log("tar: en esta práctica solo existe ~/escritorio", "bad");
    const falta = origenes.find((o) => !fs[o]);
    if (falta !== undefined) return log(`tar: ${falta}: no existe`, "bad");

    // Lo que entra al paquete: los archivos de cada carpeta y los sueltos que
    // se nombren. Se guarda el nombre a secas para poder comprobar despues si
    // el intruso sigue dentro.
    let crudo = 0;
    const hojas = [];
    const carpetas = [];
    origenes.forEach((o) => {
      const e = fs[o];
      crudo += e.bytes;
      if (e.tipo === "dir") {
        carpetas.push(o);
        e.hijos.forEach((h) => hojas.push(h));
      } else {
        hojas.push(o);
      }
    });
    fs[salida] = {
      tipo: "file",
      bytes: Math.round(crudo * RATIO),
      dentro: hojas,
      raiz: carpetas.length === 1 ? carpetas[0] : null,
      deLaCarpeta: carpetas.length === 1 ? carpetas[0] : null,
    };
    log(`${salida} creado · ${tam(crudo)} → ${tam(fs[salida].bytes)}`, "ok");
    return;
  }

  if (bandera.includes("t")) {
    const a = fs[resolver(resto[0])];
    if (!a || !a.dentro) return log(`tar: ${resto[0] || ""}: no es un archivo tar`, "bad");
    a.listado = true;
    if (a.raiz) log("  " + a.raiz + "/", "echo");
    a.dentro.forEach((n) => log("  " + (a.raiz ? a.raiz + "/" : "") + n, "echo"));
    return;
  }

  if (bandera.includes("x")) {
    const nombre = resto[0];
    const a = fs[resolver(nombre)];
    if (!a || !a.dentro) return log(`tar: ${nombre || ""}: no es un archivo tar`, "bad");
    // Sin `-C`, tar extrae donde estas parado.
    if (destino === null && cwd) destino = cwd;

    // Con `-C`, tar exige que la carpeta ya exista: no la crea.
    if (destino) {
      const d = fs[destino];
      if (!d) return log(`tar: ${destino}: no existe (créala antes)`, "bad");
      if (d.tipo !== "dir") return log(`tar: ${destino}: no es una carpeta`, "bad");
    }

    a.extraido = true;
    const raiz = a.raiz;

    // Un paquete con carpeta dentro, extraido en otro sitio, dejaria tres
    // niveles y el modelo solo lleva dos. Se guarda la carpeta con su peso
    // —que es lo que se ve en un `ls`— sin desglosar sus hojas.
    if (raiz && destino) {
      const total = a.dentro.reduce((s, n) => s + ((a.pesos && a.pesos[n]) || 100_000), 0);
      fs[destino + "/" + raiz] = { tipo: "dir", hijos: a.dentro.slice(), bytes: total };
      if (!fs[destino].hijos.includes(raiz)) {
        fs[destino].hijos.push(raiz);
        fs[destino].bytes += total;
      }
      log(`extraído en ${destino}/: ${raiz}/`, "ok");
      return;
    }

    if (raiz) fs[raiz] = { tipo: "dir", hijos: a.dentro.slice(), bytes: 0 };
    a.dentro.forEach((n) => {
      const peso = (a.pesos && a.pesos[n]) || 100_000;
      const clave = destino ? destino + "/" + n : raiz ? raiz + "/" + n : n;
      fs[clave] = { tipo: "file", bytes: peso };
      if (raiz) fs[raiz].bytes += peso;
      // Extraer dos veces el mismo paquete no duplica lo que hay dentro.
      if (destino && !fs[destino].hijos.includes(n)) {
        fs[destino].hijos.push(n);
        fs[destino].bytes += peso;
      }
    });
    const donde = destino ? `${destino}/` : raiz ? `${raiz}/` : "";
    log(`extraído: ${donde}${a.dentro.join(", ")}`, "ok");
    return;
  }

  log(`tar: operación no reconocida en "${bandera}"`, "bad");
}

function cmdRm(args) {
  const recursivo = args.some((a) => a.startsWith("-") && a.includes("r"));
  const objetivo = args.find((a) => !a.startsWith("-"));
  if (!objetivo) return log("rm: falta el archivo", "bad");
  const clave = resolver(objetivo);
  if (clave === null) return log(`rm: ${objetivo}: en esta práctica solo existe ~/escritorio`, "bad");
  const e = fs[clave];
  if (!e) return log(`rm: ${objetivo}: no existe`, "bad");
  if (e.tipo === "dir" && !recursivo) return log(`rm: ${objetivo}: es un directorio (usa -r)`, "bad");
  if (e.tipo === "dir") Object.keys(fs).forEach((k) => k.startsWith(clave + "/") && delete fs[k]);
  // Si colgaba de una carpeta, esa carpeta deja de listarlo y de pesarlo: es lo
  // que hace que volver a comprimirla de el resultado que se espera. El corte
  // va por la ultima barra: con `cd` las rutas pueden tener mas de un nivel.
  if (clave.includes("/")) {
    const corte = clave.lastIndexOf("/");
    const [padre, hoja] = [clave.slice(0, corte), clave.slice(corte + 1)];
    if (fs[padre] && fs[padre].tipo === "dir") {
      fs[padre].hijos = fs[padre].hijos.filter((n) => n !== hoja);
      fs[padre].bytes -= e.bytes;
    }
  }
  delete fs[clave];
  log(`${objetivo} eliminado`, "ok");
}

function ejecutar(linea) {
  const partes = linea.trim().split(/\s+/).filter(Boolean);
  if (partes.length === 0) return;
  const [cmd, ...args] = partes;
  log("$ " + linea, "echo");

  switch (cmd) {
    case "ls": cmdLs(args); break;
    case "tar": cmdTar(args); break;
    case "rm": cmdRm(args); break;
    case "help": AYUDA.forEach((l) => log(l, "note")); break;
    case "clear": $("consola").querySelectorAll(".log").forEach((l) => l.remove()); break;
    case "cd": cmdCd(args); break;
    default:
      log(`${cmd}: no disponible aquí. Escribe "help" para ver los comandos.`, "bad");
  }
  revisar();
}

/* ============================================================
   CORREO
   ============================================================ */
const LIMITE = 400_000;
let adjunto = null;

function pintarCorreo() {
  const zona = $("mail-adj");
  zona.innerHTML = "";
  if (!adjunto) {
    const p = document.createElement("div");
    p.className = "mail-vacio";
    p.textContent = "Sin archivos adjuntos.";
    zona.appendChild(p);
  } else {
    const e = fs[adjunto];
    const chip = document.createElement("div");
    const pesa = e ? e.bytes : 0;
    chip.className = "chip" + (pesa > LIMITE ? " malo" : "");
    chip.textContent = `${adjunto} · ${tam(pesa)}`;
    zona.appendChild(chip);
  }
  const aviso = document.createElement("div");
  aviso.className = "mail-vacio";
  aviso.textContent = `Tamaño máximo del adjunto: ${tam(LIMITE)}`;
  zona.appendChild(aviso);
  $("mail-enviar").disabled = !adjunto;
}

function avisarCorreo(texto) {
  const zona = $("mail-adj");
  const p = document.createElement("div");
  p.className = "mail-aviso";
  p.textContent = texto;
  zona.appendChild(p);
}

function abrirPicker() {
  const lista = $("picker-lista");
  lista.innerHTML = "";
  enRaiz().sort().forEach((n) => {
    const b = document.createElement("button");
    b.className = "picker-it";
    b.innerHTML = `<span></span><small>${
      fs[n].tipo === "dir" ? "carpeta" : tam(fs[n].bytes)
    }</small>`;
    b.querySelector("span").textContent = n;
    b.addEventListener("click", () => {
      $("picker").hidden = true;
      // Adjuntar una carpeta es el rechazo que da sentido al primer desafio:
      // el correo no sabe de directorios, por eso hay que empaquetar.
      if (fs[n].tipo === "dir") {
        adjunto = null;
        pintarCorreo();
        avisarCorreo(`No se pueden adjuntar carpetas. Comprime ${n}/ en un .tar.gz primero.`);
        return;
      }
      adjunto = n;
      pintarCorreo();
    });
    lista.appendChild(b);
  });
  $("picker").hidden = false;
}

function enviar() {
  const e = fs[adjunto];
  if (!e) return;
  if (e.bytes > LIMITE) {
    pintarCorreo();
    avisarCorreo(`El adjunto pesa ${tam(e.bytes)} y el máximo son ${tam(LIMITE)}. Comprímelo.`);
    return;
  }
  // Lo que se pide es el respaldo rehecho, no cualquier paquete: tiene que
  // llevar lo que venia dentro y no llevar al intruso. Sin la primera mitad,
  // el paquete del primer desafio —que tampoco lo lleva— colaba.
  const dentro = e.dentro || [];
  const debidos = ["config.yml", "registro.log"];
  const completo = debidos.every((n) => dentro.includes(n));
  const limpio = completo && !dentro.includes(nombres.intruso);
  if (!limpio) {
    pintarCorreo();
    avisarCorreo(
      dentro.includes(nombres.intruso)
        ? `Ese paquete todavía lleva ${nombres.intruso} dentro.`
        : `Ese no es el respaldo. Envía ${nombres.raizRespaldo}/ una vez rehecho.`,
    );
    return;
  }
  enviado = { nombre: adjunto, limpio: true };
  revisar();
}

/* ============================================================
   LAUNCHER
   El cuarto desafio, con la historia que le falta a los otros: el
   boton de jugar no aparece hasta que la instalacion esta bien
   hecha, asi que el `-C` no es un requisito inventado por el
   enunciado sino la condicion para que arranque el juego.
   ============================================================ */
/** El logo: la valvula sobre el rojo de la plataforma apagandose en negro. */
const LOGO_TUBO =
  '<svg class="tubo-logo" viewBox="0 0 64 64" aria-hidden="true">' +
  '<defs><radialGradient id="tubo-g" cx="34%" cy="26%" r="86%">' +
  '<stop offset="0%" stop-color="#E23050"/><stop offset="46%" stop-color="#A81530"/>' +
  '<stop offset="100%" stop-color="#0A0708"/></radialGradient></defs>' +
  '<circle cx="32" cy="32" r="32" fill="url(#tubo-g)"/><g fill="#F6EFF1">' +
  '<path d="M32 10.6c-7.2 0-13 2.5-13 5.6s5.8 5.6 13 5.6 13-2.5 13-5.6-5.8-5.6-13-5.6zm0 2.6c5.6 0 10.1 1.4 10.1 3s-4.5 3-10.1 3-10.1-1.4-10.1-3 4.5-3 10.1-3z"/>' +
  '<rect x="20.5" y="15" width="23" height="2.2" rx="1.1"/><circle cx="32" cy="16.2" r="2.9"/>' +
  '<rect x="30.4" y="18" width="3.2" height="7" rx="1"/><rect x="26.5" y="24.5" width="11" height="6.5" rx="1.6"/>' +
  '<rect x="23.5" y="30" width="17" height="3.4" rx="1.4"/><rect x="17.5" y="34.5" width="29" height="14.5" rx="6.5"/>' +
  '<rect x="10.5" y="32.5" width="7.5" height="18.5" rx="2.2"/><rect x="46" y="32.5" width="7.5" height="18.5" rx="2.2"/>' +
  "</g></svg>";

/** La caratula: un mando blanco sobre el azul del juego. */
const ART_JUEGO =
  '<svg viewBox="0 0 64 44" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M21 8h22a13 13 0 0 1 13 13v3.5a7.5 7.5 0 0 1-13.4 4.6L40 26H24l-2.6 3.1A7.5 7.5 0 0 1 8 24.5V21A13 13 0 0 1 21 8z"/>' +
  '<path d="M17 16v8M13 20h8"/><circle cx="44" cy="17.5" r="1.9" fill="#fff" stroke="none"/>' +
  '<circle cx="49" cy="22.5" r="1.9" fill="#fff" stroke="none"/></svg>';

const ICONO_BAJAR =
  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M12 4v11M7.5 11l4.5 4.5L16.5 11M5 19h14"/></svg>';

const ICONO_PLAY =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">' +
  '<path d="M8 5.5l11 6.5-11 6.5z"/></svg>';

/**
 * La ventana entera se repinta en cada cambio de estado. Es lo mismo que hace
 * el resto del simulador y evita el error de dejar un boton vivo describiendo
 * un estado que ya paso.
 */
function pintarJuego() {
  const cont = $("game-body");
  if (!cont) return;

  // Jugable solo con los mods puestos y sin la descarga a medio instalar. Lo
  // que hay que hacer para llegar ahi lo dice la ventana de objetivos: aqui no
  // se repite, que es informacion de mas sobre la misma cabeza.
  const activo = listoParaJugar() && !jugado;

  cont.innerHTML =
    `<div class="tubo-hdr">${LOGO_TUBO}<span class="tubo-marca">TUBO</span></div>` +
    `<div class="tubo-main">` +
      `<div class="tubo-izq"><div class="game-art">${ART_JUEGO}</div></div>` +
      `<div class="tubo-info">` +
        `<div class="game-name"></div>` +
        `<div class="game-dir-t">Directorio del juego</div>` +
        `<div class="game-ruta"><code></code>` +
        `<button class="game-copiar" id="game-copiar">Copiar</button></div>` +
      `</div>` +
      `<div class="tubo-com">` +
        `<div class="com-t">Posts de la Comunidad</div>` +
        `<div class="com-post top"><span></span>` +
        `<button class="com-baja" id="game-bajar" title="Descargar el mod"` +
        `${descargado ? " disabled" : ""}>${descargado ? "✓" : ICONO_BAJAR}</button></div>` +
        `<div class="com-post"><span>Community notes</span></div>` +
        `<div class="com-post"><span>Community notes</span></div>` +
      `</div>` +
    `</div>` +
    `<div class="tubo-pie">` +
      `<button class="game-play${activo ? " listo" : ""}" id="game-jugar"` +
      `${activo ? "" : " disabled"}>${ICONO_PLAY}<span>Play</span></button>` +
    `</div>`;

  // Los datos van por textContent: nombres sorteados, no plantilla.
  cont.querySelector(".game-name").textContent = nombres.juego;
  cont.querySelector(".game-ruta code").textContent = rutaMods();
  cont.querySelector(".com-post.top span").textContent = "OMG miren este mod!";
}

function descargarPack() {
  descargado = true;
  fs[nombres.pack] = {
    tipo: "file",
    bytes: 310_000,
    // Sin carpeta dentro: los mods van sueltos, que es como los reparte
    // cualquier pack de verdad y lo que hace util el `-C`.
    raiz: null,
    dentro: MODS.concat(["leeme.txt"]),
    pesos: { [MODS[0]]: 420_000, [MODS[1]]: 610_000, "leeme.txt": 2_000 },
  };
  log(`descargado: ${nombres.pack}`, "ok");
  revisar();
}

function copiarRuta(boton) {
  const texto = rutaMods();
  const listo = () => {
    boton.textContent = "Copiado";
    setTimeout(() => { if (boton.isConnected) boton.textContent = "Copiar"; }, 1400);
    // El clic dejo el foco en el boton: se devuelve, o el Ctrl+V siguiente se
    // pierde justo despues de haber copiado.
    enfocarEntrada();
  };
  // El portapapeles moderno falla en algunos iframes; el textarea de toda la
  // vida es el que responde entonces.
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(listo).catch(() => copiarViejo(texto, listo));
  } else {
    copiarViejo(texto, listo);
  }
}

function copiarViejo(texto, listo) {
  const ta = document.createElement("textarea");
  ta.value = texto;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); listo(); } catch { /* sin portapapeles: se teclea */ }
  document.body.removeChild(ta);
}

function jugar() {
  if (!listoParaJugar()) return;
  jugado = true;
  log("▶ " + nombres.juego + ": partida iniciada con los mods cargados", "ok");
  revisar();
}

// Un solo escuchador para toda la ventana: el contenido se repinta entero en
// cada cambio de estado y los botones nacen y mueren con el.
$("game-body").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.id === "game-copiar") copiarRuta(b);
  if (b.id === "game-bajar") descargarPack();
  if (b.id === "game-jugar") jugar();
});

/* ============================================================
   PROGRESO
   ============================================================ */
function revisar() {
  const lista = desafios();
  while (paso < lista.length && lista[paso].hecho()) {
    log("✓ " + lista[paso].objetivo, "ok");
    paso++;
  }
  pintar();
  if (paso >= lista.length) terminar();
}

function pintar() {
  const lista = desafios();
  barra.objetivo(paso < lista.length ? lista[paso].objetivo : "Completado",
                 Math.min(paso, lista.length - 1), lista.length);
  barra.marcas(lista.map((_, i) => (i < paso ? "done" : i === paso ? "cur" : "")));

  const cont = $("pasos");
  cont.innerHTML = "";
  const titulo = document.createElement("div");
  titulo.className = "gutter txt-titulo";
  const t = document.createElement("span");
  t.textContent = "Objetivos";
  titulo.appendChild(t);
  cont.appendChild(titulo);

  // Solo lo hecho y lo que toca ahora. Enseñar los cuatro de golpe es contar
  // el final antes de tiempo y cargar de instrucciones a quien todavia esta
  // con la primera; cada uno aparece cuando le llega el turno.
  lista.slice(0, paso + 1).forEach((d, i) => {
    const fila = document.createElement("div");
    fila.className = "gutter linea " + (i < paso ? "done" : "cur");
    fila.innerHTML = '<span class="ln"></span><span class="paso-t"></span>';
    fila.querySelector(".ln").textContent = String(i + 1);
    fila.querySelector(".paso-t").textContent = d.texto;
    cont.appendChild(fila);
  });
  pintarIconos();
  pintarJuego();
}

function pintarIconos() {
  const cont = $("icons");
  cont.innerHTML = "";
  // La carpeta de mods es del juego, no del escritorio: no ocupa icono. El
  // paquete si aparece, pero solo cuando se descarga, que es cuando existe.
  // El tope da para todo lo que puede haber a la vez —lo del principio, lo
  // que se empaqueta, lo que se extrae y la descarga— sin que nada se caiga.
  enRaiz().filter((n) => n !== nombres.mods).sort().slice(0, 8).forEach((n) => {
    const e = fs[n];
    const it = document.createElement("div");
    it.className = "icon";
    it.innerHTML =
      `<div class="icon-art">${e.tipo === "dir" ? SVG.carpeta : SVG.paquete}</div>` +
      `<div class="icon-name"></div><div class="icon-size">${tam(e.bytes)}</div>`;
    it.querySelector(".icon-name").textContent = n;
    cont.appendChild(it);
  });
}

function terminar() {
  $("fin-p").textContent =
    `Empaquetaste una carpeta, miraste dentro de un paquete antes de abrirlo, ` +
    `enviaste ${enviado.nombre} sin lo que no debía salir y dejaste los mods de ` +
    `${nombres.juego} instalados donde el juego los busca.`;
  $("fin").hidden = false;
}

/* ============================================================
   ENTRADA
   ============================================================ */
let tecleado = "";

const ocupado = () =>
  !$("fin").hidden || !$("picker").hidden || !$("portada").classList.contains("hide");

/**
 * El pegado.
 *
 * La ruta de los mods se copia con un boton, asi que sin Ctrl+V la practica se
 * queda a medias: habria que teclear a mano lo que la ventana acaba de poner
 * en el portapapeles. Como aqui no se escribe en un `input` sino en el
 * documento, el evento `paste` no llega solo; lo recoge un textarea escondido
 * que se mantiene enfocado.
 */
function enfocarEntrada() {
  const t = $("pegar");
  if (t && t.focus) t.focus({ preventScroll: true });
}

function pegarTexto(texto) {
  if (!texto) return;
  // Solo la primera linea. Un pegado con salto de linea ejecutaria la orden
  // sin que nadie la haya leido, y aqui la gracia es verla antes de Enter.
  tecleado += texto.split(/\r?\n/)[0];
  $("typed").textContent = tecleado;
}

document.addEventListener("paste", (ev) => {
  if (ocupado()) return;
  const datos = ev.clipboardData || window.clipboardData;
  if (!datos) return;
  ev.preventDefault();
  pegarTexto(datos.getData("text"));
  const t = $("pegar");
  if (t) t.value = "";
});

document.addEventListener("keydown", (ev) => {
  if (!$("fin").hidden || !$("picker").hidden || !$("portada").classList.contains("hide")) return;
  if (ev.key === "Enter") {
    const linea = tecleado;
    tecleado = "";
    $("typed").textContent = "";
    ejecutar(linea);
    return;
  }
  if (ev.key === "Backspace") {
    tecleado = tecleado.slice(0, -1);
  } else if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey) {
    tecleado += ev.key;
  } else {
    return;
  }
  ev.preventDefault();
  $("typed").textContent = tecleado;
});

/* ---------- dock ---------- */
function alternar(idVentana, idBoton) {
  const v = $(idVentana);
  v.hidden = !v.hidden;
  $(idBoton).dataset.abierta = String(!v.hidden);
}
// El correo y el launcher comparten cuadrante: abrir uno cierra el otro, que
// es lo unico que evita que se pisen sin moverlos de sitio.
function cerrar(idVentana, idBoton) {
  $(idVentana).hidden = true;
  $(idBoton).dataset.abierta = "false";
}
$("d-mail").addEventListener("click", () => {
  alternar("w-mail", "d-mail");
  if (!$("w-mail").hidden) {
    cerrar("w-game", "d-game");
    pintarCorreo();
  }
});
$("d-game").addEventListener("click", () => {
  alternar("w-game", "d-game");
  if (!$("w-game").hidden) {
    cerrar("w-mail", "d-mail");
    pintarJuego();
  }
});
$("d-txt").addEventListener("click", () => alternar("w-txt", "d-txt"));
// La terminal tambien se cierra. Detras no hay escritorio vacio: esta la marca.
$("d-term").addEventListener("click", () => alternar("w-term", "d-term"));

// Minimizar solo esconde: nunca abre, asi que no necesita lo que arrastran los
// botones del dock al abrir (pintar el correo, montar el juego).
document.querySelectorAll("button.win-dot.min").forEach((b) =>
  b.addEventListener("click", () => cerrar(b.dataset.win, b.dataset.dock)));

$("mail-adjuntar").addEventListener("click", abrirPicker);
$("mail-enviar").addEventListener("click", enviar);
$("picker").addEventListener("click", (ev) => {
  if (ev.target === $("picker")) $("picker").hidden = true;
});

function reiniciar() {
  nuevaPartida();
  adjunto = null;
  tecleado = "";
  $("typed").textContent = "";
  $("consola").querySelectorAll(".log").forEach((l) => l.remove());
  $("fin").hidden = true;
  $("picker").hidden = true;
  barra.jugando(false);
  $("portada").classList.remove("hide");
  cerrar("w-game", "d-game");
  pintarPrompt();
  pintarCorreo();
  pintar();
}

// El foco vive en el cazador de pegados. Se le devuelve al arrancar y despues
// de cualquier clic en el escritorio, que es lo que se lo quita.
$("play").addEventListener("click", () => {
  $("portada").classList.add("hide");
  barra.jugando(true);
  enfocarEntrada();
});
$("desk").addEventListener("click", enfocarEntrada);
$("fin-again").addEventListener("click", reiniciar);
$("fin-exit").addEventListener("click", Barra.salir);

reiniciar();

// Gancho de pruebas: el arnes de Node necesita empujar el estado sin DOM.
if (typeof globalThis !== "undefined" && globalThis.__PRUEBAS__) {
  globalThis.__api = {
    ejecutar, enviar, reiniciar, desafios, descargarPack, jugar,
    fs: () => fs, nombres: () => nombres, paso: () => paso,
    adjuntar: (n) => { adjunto = n; },
    listoParaJugar, modsInstalados,
  };
}
</script>
