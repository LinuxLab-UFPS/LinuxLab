<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Descifrar el enigma</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   DESCIFRAR EL ENIGMA
   Cuatro datos repartidos por una unidad incautada. Cada uno se
   saca con una herramienta distinta del tema de busqueda, y el
   panel de descifrado es lo que convierte una respuesta leida en
   un estado que el simulador puede comprobar: buscar no deja
   rastro en el sistema de archivos, a diferencia de comprimir.
   ============================================================ */
:root{
  /* La misma paleta que los otros simuladores del curso: la cabecera y la
     portada tienen que verse como una familia, aunque dentro cambie el mundo. */
  --fondo:  #0D1117;
  --surf:   #161B22;
  --surf2:  #1C2128;
  --border: #21262D;
  --red:    #FF0030;
  --green:  #2ECC71;
  --text:   #C9D1D9;
  --bright: #F0F6FC;
  --muted:  #6B8399;
  --dim:    #21262D;
  --gold:   #FFC400;
  --mono:'SF Mono','Fira Mono','Cascadia Mono',Consolas,'Courier New',monospace;
  /* Lo propio de este simulador: el verde de fosforo de la unidad del enigma. */
  --verde-crt:#39FF6A;
  --verde-tenue:#1C5E30;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--fondo);color:var(--text);font:14px/1.5 var(--mono);display:flex;flex-direction:column;overflow:hidden}

/* cabecera comun a los simuladores del curso */
.hdr{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;min-height:48px;z-index:50}
.logo-box{width:28px;height:28px;border-radius:5px;border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--red);filter:drop-shadow(0 0 6px rgba(255,0,48,.5));flex-shrink:0}
.logo-name{font-size:14px;font-weight:700;letter-spacing:.03em;color:var(--red);filter:drop-shadow(0 0 8px rgba(255,0,48,.3));flex-shrink:0}
.logo-name .wh{color:var(--bright);filter:none}
.hdr-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
.hdr-obj{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;overflow:hidden}
.hdr-eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);font-weight:700;flex-shrink:0}
.hdr-goal{font-size:13px;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-dots{display:flex;gap:5px;align-items:center;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .3s,box-shadow .3s}
.dot.done{background:var(--green)}
.dot.cur{background:var(--red);box-shadow:0 0 7px rgba(255,0,48,.75)}
.hdr-n{font-size:12px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.restart-btn{background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:var(--mono);font-size:11px;padding:4px 10px;cursor:pointer;flex-shrink:0;transition:color .2s,border-color .2s}
.restart-btn:hover{color:var(--text);border-color:var(--muted)}

/* ============================================================
   LOS DOS APARATOS
   La baticomputadora es donde se busca y la unidad del enigma es
   donde se entrega. Son dos marcos y no uno porque esa es la
   division que cuesta ver: buscar no cambia nada en el sistema,
   el resultado hay que sacarlo y llevarlo a otra parte.

   El marco es una imagen de fondo y la pantalla va posicionada en
   porcentajes sobre ella. Si la imagen no carga, `sin-marco` deja
   los dos paneles planos y el simulador funciona igual.
   ============================================================ */
.desk{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,34px);padding:14px;
  background:radial-gradient(120% 90% at 50% 0%,#12181F 0%,#080B0F 70%)}

.aparato{position:relative;background-size:100% 100%;background-repeat:no-repeat;flex-shrink:0}
.bat{aspect-ratio:1376/768;height:100%;max-width:70%;
  background-image:url("marco-batcomputadora.webp");
  /* Medido sobre la propia imagen: donde empieza y acaba el hueco negro. */
  --p-top:15.5%;--p-right:15.3%;--p-bottom:18.1%;--p-left:15.9%}
.unidad{aspect-ratio:560/1003;height:100%;
  background-image:url("marco-unidad.webp");
  --p-top:11.8%;--p-right:19.3%;--p-bottom:25.3%;--p-left:19.5%}

.pantalla{position:absolute;top:var(--p-top);right:var(--p-right);bottom:var(--p-bottom);left:var(--p-left);
  background:#000;display:flex;flex-direction:column;overflow:hidden}

/* El cable que une los dos aparatos. */
.cable{flex:0 0 auto;width:clamp(18px,4vw,64px);height:2px;background:linear-gradient(90deg,#2A3340,#4A5A6B);position:relative;align-self:center}
.cable::before,.cable::after{content:"";position:absolute;top:-3px;width:8px;height:8px;border-radius:2px;background:#4A5A6B}
.cable::before{left:-4px}
.cable::after{right:-4px}

/* terminal: negro, letra blanca, simbolo del sistema en verde */
.consola{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;font-size:clamp(9px,1.15vmin + 2px,12.5px);display:flex;flex-direction:column;gap:2px;color:#E8EDF2}
.log{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.log.eco{color:#FFFFFF}
.log.ok{color:var(--green)}
.log.mal{color:#FF5C7A}
.log.nota{color:#8FA3B8}
.log.arte{color:var(--verde-crt);white-space:pre;font-size:clamp(3.4px,.62vw,8px);line-height:1.06;text-shadow:0 0 8px rgba(57,255,106,.45);align-self:center;margin-bottom:6px}
.prompt{display:flex;gap:8px;flex-shrink:0;padding-top:2px;font-size:clamp(9px,1.15vmin + 2px,12.5px)}
.ps1{color:var(--verde-crt);flex-shrink:0}
.tecleado{color:#FFFFFF;white-space:pre-wrap;word-break:break-all}
.caret{display:inline-block;width:7px;height:13px;background:#FFFFFF;vertical-align:-2px;animation:parpadeo 1s step-end infinite}
@keyframes parpadeo{50%{opacity:0}}

/* ---------- la unidad del enigma ---------- */
.unidad .pantalla{padding:6% 7%;gap:5%;background:#020604}

/* El bloque de arriba: fondo rayado, interrogaciones sueltas y el mensaje. */
.riddle{position:relative;flex:0 0 auto;border:2px solid var(--verde-crt);border-radius:4px;padding:9px 11px;overflow:hidden;
  background:repeating-linear-gradient(135deg,rgba(57,255,106,.14) 0 6px,rgba(2,6,4,.9) 6px 13px);
  box-shadow:0 0 16px rgba(57,255,106,.35),inset 0 0 22px rgba(57,255,106,.12)}
.riddle-t{color:var(--verde-crt);font-weight:700;font-size:clamp(9px,1.5vmin,13px);letter-spacing:.1em;text-align:center;margin-bottom:6px;text-shadow:0 0 9px rgba(57,255,106,.7)}
.riddle-p{color:#B9FFD0;font-size:clamp(7.5px,1.15vmin,10.5px);line-height:1.6;position:relative;z-index:1}
.riddle-p b{color:var(--verde-crt)}
.riddle-firma{color:var(--verde-crt);text-align:right;font-size:clamp(11px,2vmin,18px);line-height:1;margin-top:4px}
/* Interrogaciones flotando por detras del texto. Se mueven despacio: un
   parpadeo rapido distrae al leer y es de lo que revisa accesibilidad. */
.interros{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.interros span{position:absolute;color:rgba(57,255,106,.35);font-weight:700;animation:flotar 7s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-9px);opacity:.6}}

.campos{display:flex;flex-direction:column;gap:5%;flex:1;min-height:0}
.campo{display:flex;flex-direction:column;gap:2px}
.campo label{font-size:clamp(6px,.95vmin,9px);letter-spacing:.12em;text-transform:uppercase;color:#5F8F72}
.campo input{background:#04120A;border:1.5px solid var(--verde-tenue);border-radius:3px;padding:5px 7px;color:var(--verde-crt);font:inherit;font-size:clamp(7.5px,1.15vmin,11px)}
.campo input:focus{outline:none;border-color:var(--verde-crt);box-shadow:0 0 10px rgba(57,255,106,.35)}
.campo.ok input{border-color:var(--verde-crt);background:rgba(57,255,106,.12)}
.campo.mal input{border-color:#FF5C7A}
.btn{flex:0 0 auto;background:var(--verde-crt);color:#04120A;border:none;border-radius:3px;padding:7px;font:inherit;font-weight:700;font-size:clamp(8px,1.2vmin,12px);letter-spacing:.08em;cursor:pointer;text-transform:uppercase;box-shadow:0 0 14px rgba(57,255,106,.4)}
.btn:hover{background:#7CFFA5}
.aviso{flex:0 0 auto;font-size:clamp(6.5px,1vmin,9.5px);color:#FF5C7A;min-height:11px;text-align:center}

/* Sin las imagenes de marco, o en pantalla pequena, los aparatos son paneles
   planos: lo que no puede perderse es el sitio para leer la salida. */
body.sin-marco .aparato{background-image:none;aspect-ratio:auto;height:auto;max-width:none;border:1px solid var(--border);border-radius:8px;background-color:var(--surf)}
body.sin-marco .bat{flex:1;height:100%}
body.sin-marco .unidad{width:clamp(240px,26%,340px);height:100%}
body.sin-marco .pantalla{position:static;inset:auto;flex:1;border-radius:7px}
body.sin-marco .cable{display:none}

@media (max-width:900px),(max-height:520px){
  .desk{flex-direction:column;overflow-y:auto;align-items:stretch}
  .aparato{background-image:none !important;aspect-ratio:auto !important;height:auto !important;max-width:none !important;border:1px solid var(--border);border-radius:8px;background-color:var(--surf)}
  .bat{min-height:320px;display:flex}
  .pantalla{position:static !important;inset:auto !important;flex:1;border-radius:7px}
  .cable{display:none}
}

/* portada y final: mismo tamaño y mismos colores que los otros simuladores */
.velo{position:absolute;inset:0;background:rgba(13,17,23,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:40;padding:24px;text-align:center}
.velo[hidden]{display:none}
.velo h2{font-size:19px;color:var(--bright);font-weight:700}
.velo p{font-size:12px;color:var(--muted);max-width:430px;line-height:1.7}
.play{width:86px;height:86px;border-radius:50%;border:2px solid var(--red);background:rgba(255,0,48,.1);color:var(--red);font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;box-shadow:0 0 22px rgba(255,0,48,.35);font-family:var(--mono);line-height:1}
.play .tri{display:block;transform:translateX(3px)}
.play:hover{transform:scale(1.06);box-shadow:0 0 32px rgba(255,0,48,.55)}
.velo .interro{font-size:52px;color:var(--verde-crt);line-height:1;text-shadow:0 0 18px rgba(57,255,106,.5)}
.velo-btns{display:flex;gap:10px}
.velo-btns button{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:8px 16px;font:inherit;font-size:12px;cursor:pointer}
.velo-btns button:hover{border-color:var(--red);color:var(--bright)}

/* pegado: el evento paste solo llega a algo editable */
.pegar{position:fixed;top:-300px;left:-300px;width:1px;height:1px;opacity:0}

@media (max-width:900px){
  .desk{grid-template-columns:1fr;overflow-y:auto}
  #w-term{min-height:300px}
}
</style>

<div class="hdr">
  <div class="logo-box">&gt;_</div>
  <div class="logo-name">Linux<span>Lab</span></div>
  <div class="hdr-sep"></div>
  <div class="hdr-obj">
    <span class="hdr-eyebrow">Objetivo</span>
    <span class="hdr-goal" id="goal">&nbsp;</span>
  </div>
  <div class="hdr-dots" id="dots"></div>
  <span class="hdr-n" id="counter">1 / 4</span>
  <button class="restart-btn" id="restart">Reiniciar</button>
</div>

<div class="desk" id="desk">
  <!-- baticomputadora: la terminal donde se busca -->
  <div class="aparato bat">
    <div class="pantalla">
      <div class="consola" id="consola">
        <div class="prompt">
          <span class="ps1" id="ps1">~/pruebas $</span>
          <span><span class="tecleado" id="tecleado"></span><span class="caret"></span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="cable" aria-hidden="true"></div>

  <!-- unidad del enigma: donde se entregan las respuestas -->
  <div class="aparato unidad">
    <div class="pantalla">
      <div class="riddle">
        <div class="interros" id="interros" aria-hidden="true"></div>
        <div class="riddle-t">ADIVÍNAME ESTO…</div>
        <div class="riddle-p" id="riddle-p"></div>
        <div class="riddle-firma">?</div>
      </div>
      <div class="campos" id="campos"></div>
      <button class="btn" id="descifrar">Descifrar</button>
      <div class="aviso" id="aviso"></div>
    </div>
  </div>

  <textarea id="pegar" class="pegar" aria-hidden="true" tabindex="-1"></textarea>

  <div class="velo" id="portada">
    <button class="play" id="play"><span class="tri">&#9654;</span></button>
    <h2>Descifrar el enigma</h2>
    <p>
      Una unidad incautada y una nota que promete cuatro datos escondidos en
      ella. Ninguno está donde se buscaría primero. Sácalos con <b>grep</b>,
      <b>find</b> y <b>sort</b>, y escríbelos en el panel de descifrado.
    </p>
  </div>

  <div class="velo" id="fin" hidden>
    <div class="interro">?</div>
    <h2>Enigma descifrado</h2>
    <p id="fin-p"></p>
    <div class="velo-btns">
      <button id="fin-again">Otro caso</button>
      <button id="fin-exit">Salir</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

/* El murcielago que saluda al arrancar. Va en verde de fosforo, como todo lo
   que escribe esta maquina, y en cuerpo pequeno para que quepa entero. */
const MURCIELAGO = [
"                       < $$$                                             k% b",
"                   Lc$$$$^                                                \\$$$$u:",
"                ($$$$$$$t                    $$      r                     0$$$$$$$f",
"             $@$$$$$$$$$$                    \\_      $x                    U$$$$$$$$$~$",
"            $$$$$$$$$$$$$@$                  %$n    8$z                   c$$$$$$$$$$$$.$",
"          &$$$$$$$$$$$$$$$$;                  $@tjt|$$Q                 !$$$$$$$$$$$$$$$$",
"        Y$$$$$$$$$$$$$$$$$$$$$\"             $$$$$$$$$$)              (J$$$$$$$$$$$$$$$$$$$$Q",
"       1$$$$$$$$$$$$$$$$$$$$$$$$$$(Y        d$$$$$$$$$$$       $o[$$$$$$$$$$$$$$$$$$$$$$$$$$m",
"      b$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$c*  $$$$$$$$$$;';W$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$_",
"      $$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$",
"     ;$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$0",
"     $$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$",
"     0^Q         Z\`$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$%^/         X^{",
"                     x $$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$*",
"                        k$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$X",
"                         :$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$~",
"                          ;*;>       ?\"$$$$$$$$$$$$$$$$$$$$$^;|       Y;'",
"                                          ;$$$$$$$$$$$$$$*",
"                                            '$$$$$$$$$$,",
"                                              p$$$$$$>",
"                                               '$$$$l",
"                                                ~$$}",
"                                                 .`",
].join("\n");
const alAzar = (xs) => xs[Math.floor(Math.random() * xs.length)];
const entero = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* ============================================================
   EL CASO
   Los cuatro datos se sortean en cada partida: dos estudiantes
   sentados juntos no pueden copiarse la respuesta, tienen que
   repetir la busqueda.
   ============================================================ */
const LUGARES = ["Muelle 9", "Planta Sionis", "Almacen Kane", "Torre Wayne", "Puerto Este"];
const NOMBRES = ["nygma", "kyle", "dent", "cobblepot", "isley"];
const CONTACTOS = ["Alberto Falcone", "Selina Kyle", "Lucius Fox", "Renee Montoya"];

let caso, fs, cwd, paso, resueltos;

/** Texto plano de un archivo, como lista de lineas. */
function nuevoCaso() {
  const lugar = alAzar(LUGARES);
  const placa = "GC-" + entero(1000, 9999);
  const hora = String(entero(1, 4)).padStart(2, "0") + ":" + String(entero(10, 59));
  const informante = alAzar(NOMBRES);
  const camaras = [3, 7, 11, 14, 22];
  const camara = alAzar(camaras);

  caso = { lugar, placa, hora, informante, camara: "camara-" + String(camara).padStart(2, "0") };

  // ---- registros de camaras: mucho ruido y unas pocas lineas del sospechoso
  const placasRuido = ["GC-2210", "GC-8834", "GC-5567", "GC-4102", "GC-9938"];
  const linea = (h, c, p) => `${h} ${"camara-" + String(c).padStart(2, "0")} ${p}`;
  const registros = { norte: [], sur: [], puerto: [] };
  const zonas = Object.keys(registros);
  for (let i = 0; i < 90; i++) {
    const z = zonas[i % 3];
    const h = String(entero(0, 23)).padStart(2, "0") + ":" + String(entero(10, 59));
    registros[z].push(linea(h, alAzar(camaras), alAzar(placasRuido)));
  }
  // La camara buscada ve la placa mas veces que ninguna otra.
  const otras = camaras.filter((c) => c !== camara);
  for (let i = 0; i < 6; i++) {
    const h = String(entero(0, 23)).padStart(2, "0") + ":" + String(entero(10, 59));
    registros[alAzar(zonas)].push(linea(h, camara, placa));
  }
  for (let i = 0; i < 3; i++) {
    const h = String(entero(0, 23)).padStart(2, "0") + ":" + String(entero(10, 59));
    registros[alAzar(zonas)].push(linea(h, alAzar(otras), placa));
  }
  // La unica aparicion con la hora del encuentro va en el informe, no aqui:
  // asi la hora se saca por la forma de la placa y no contando lineas.
  registros.norte.push(linea(hora, camara, placa));

  const ahora = Date.now();
  const dia = 86400000;
  const F = (ruta, lineas, edad) => ({ ruta, lineas, edad: edad === undefined ? dia * entero(3, 40) : edad });

  const archivos = [
    F("informes/caso-0412.txt", [
      "INFORME PRELIMINAR",
      "El sospechoso abandono el vehiculo antes del amanecer.",
      "Testigos describen un maletin metalico.",
      "Sin coincidencias en la base de datos.",
    ]),
    F("informes/caso-0417.txt", [
      "INFORME COMPLEMENTARIO",
      `Punto de encuentro confirmado: ${lugar}.`,
      "La reunion se repite cada semana segun el informante.",
      "Pendiente de verificar la matricula del vehiculo.",
    ]),
    F("informes/interrogatorio.txt", [
      "P: Donde lo vio por ultima vez",
      "R: No pienso responder a eso.",
      "P: Reconoce este vehiculo",
      `R: Placa ${placa}. Lo vi salir a las ${hora}, no me pregunte mas.`,
    ]),
    F("notas/contactos.txt", CONTACTOS.map((c, i) => `${c},${entero(2, 9)} llamadas`)),
    F("notas/descartado.txt", [
      "Pista falsa: el almacen del norte lleva dos anos cerrado.",
      "No perder tiempo aqui.",
    ]),
    F("notas/recado.txt", [
      "Si lees esto, ya llegaste tarde.",
      "Las respuestas estan repartidas. Ninguna donde deberias mirar.",
    ]),
    F("camaras/registro-norte.log", registros.norte),
    F("camaras/registro-sur.log", registros.sur),
    F("camaras/registro-puerto.log", registros.puerto),
    F("evidencias/huella.dat", ["binario: 8f2a41b0"]),
    F("evidencias/audio-01.dat", ["binario: 22c9de71"]),
    // El informante: el ultimo archivo que entro a la unidad.
    F(`evidencias/${informante}.dat`, ["binario: 0af71c33"], 1000 * 60 * 4),
  ];

  fs = {};
  for (const a of archivos) {
    fs[a.ruta] = { tipo: "file", lineas: a.lineas, fecha: ahora - a.edad };
    // los directorios se crean solos a partir de las rutas
    const partes = a.ruta.split("/");
    for (let i = 1; i < partes.length; i++) {
      const dir = partes.slice(0, i).join("/");
      if (!fs[dir]) fs[dir] = { tipo: "dir", fecha: ahora - dia * 41 };
    }
  }

  cwd = "";
  paso = 0;
  resueltos = { lugar: false, hora: false, informante: false, camara: false };
}

/* ============================================================
   SISTEMA DE ARCHIVOS
   ============================================================ */
function resolver(ruta) {
  const t = (ruta || "").trim();
  if (!t || t === ".") return cwd;
  if (t === "~" || t === "~/pruebas") return "";
  let partes;
  if (t.startsWith("~/pruebas/")) partes = t.slice(10).split("/");
  else if (t.startsWith("~/")) partes = t.slice(2).split("/");
  else if (t.startsWith("/")) return null;
  else partes = (cwd ? cwd.split("/") : []).concat(t.split("/"));
  const pila = [];
  for (const p of partes) {
    if (!p || p === ".") continue;
    if (p === "..") { pila.pop(); continue; }
    pila.push(p);
  }
  return pila.join("/");
}

const existe = (clave) => clave === "" || Boolean(fs[clave]);
const esDir = (clave) => clave === "" || (fs[clave] && fs[clave].tipo === "dir");

/** Contenido de un directorio, sin bajar de nivel. */
function hijos(dir) {
  const pref = dir ? dir + "/" : "";
  const set = new Set();
  for (const k of Object.keys(fs)) {
    if (!k.startsWith(pref)) continue;
    const resto = k.slice(pref.length);
    if (!resto) continue;
    set.add(resto.split("/")[0]);
  }
  return [...set].sort();
}

/** Todos los archivos bajo una ruta, incluida ella misma. */
function bajo(dir) {
  const pref = dir ? dir + "/" : "";
  return Object.keys(fs).filter((k) => k === dir || k.startsWith(pref)).sort();
}

/* ============================================================
   CONSOLA
   ============================================================ */
function log(texto, clase) {
  const d = document.createElement("div");
  d.className = "log" + (clase ? " " + clase : "");
  d.textContent = texto;
  const c = $("consola");
  const prompt = c.querySelector(".prompt");
  if (prompt) c.insertBefore(d, prompt); else c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

const AYUDA = [
  "Comandos disponibles:",
  "  ls [-l] [ruta]                 lista un directorio",
  "  cd <ruta>                      entra en un directorio",
  "  cat <archivo>                  muestra un archivo",
  "  head/tail [-n N] <archivo>     primeras o ultimas lineas",
  "  wc -l <archivo>                cuenta lineas",
  "  grep [-inrlcvowE] [-A/-B/-C n] <patron> [archivos]",
  "  find <ruta> [-name X] [-type f|d] [-size +N] [-mmin -N]",
  "  sort [-n] [-r] [-t X] [-k N]   ordena lo que recibe",
  "  uniq [-c]                      colapsa repetidas seguidas",
  "  clear                          limpia la consola",
  "",
  "Se pueden encadenar con | (pipe).",
];

/* ---------- utilidades de opciones ---------- */
function separa(args) {
  const flags = [];
  const libres = [];
  const valores = {};
  for (let i = 0; i < args.length; i++) {
    const a = args[i];
    if (a === "-n" || a === "-A" || a === "-B" || a === "-C" || a === "-k") {
      valores[a] = args[++i];
    } else if (a.startsWith("-t") && a.length > 2) {
      valores["-t"] = a.slice(2);
    } else if (a === "-t") {
      valores["-t"] = args[++i];
    } else if (a.startsWith("-") && a.length > 1) {
      for (const c of a.slice(1)) flags.push("-" + c);
    } else {
      libres.push(a);
    }
  }
  return { flags, libres, valores };
}

const quita = (s) => (s || "").replace(/^['"]|['"]$/g, "");

/* ---------- comandos ----------
   Cada uno recibe lo que le llega por el pipe (lista de lineas o
   null si es el primero de la cadena) y devuelve lista de lineas. */
function cmdLs(args) {
  const { flags, libres } = separa(args);
  const clave = resolver(libres[0]);
  if (clave === null || !existe(clave)) { log(`ls: ${libres[0] || ""}: no existe`, "mal"); return []; }
  if (!esDir(clave)) return [libres[0]];
  return hijos(clave).map((h) => {
    const e = fs[clave ? clave + "/" + h : h];
    const marca = e && e.tipo === "dir" ? "/" : "";
    if (!flags.includes("-l")) return h + marca;
    const n = e && e.lineas ? e.lineas.length : 0;
    const fecha = new Date(e ? e.fecha : Date.now());
    const sello = `${String(fecha.getDate()).padStart(2, "0")}/${String(fecha.getMonth() + 1).padStart(2, "0")} ${String(fecha.getHours()).padStart(2, "0")}:${String(fecha.getMinutes()).padStart(2, "0")}`;
    return `${e && e.tipo === "dir" ? "d" : "-"}  ${String(n).padStart(4)} lineas  ${sello}  ${h}${marca}`;
  });
}

function cmdCd(args) {
  const { libres } = separa(args);
  const clave = resolver(libres[0] === undefined ? "~" : libres[0]);
  if (clave === null || !existe(clave)) { log(`cd: ${libres[0]}: no existe`, "mal"); return []; }
  if (!esDir(clave)) { log(`cd: ${libres[0]}: no es un directorio`, "mal"); return []; }
  cwd = clave;
  $("ps1").textContent = "~/pruebas" + (cwd ? "/" + cwd : "") + " $";
  return [];
}

function leer(nombre) {
  const clave = resolver(nombre);
  if (clave === null || !fs[clave] || fs[clave].tipo !== "file") return null;
  return fs[clave].lineas;
}

function cmdCat(args) {
  const { libres } = separa(args);
  const salida = [];
  for (const n of libres) {
    const l = leer(n);
    if (!l) { log(`cat: ${n}: no existe o es un directorio`, "mal"); continue; }
    salida.push(...l);
  }
  return salida;
}

function cmdHeadTail(args, entrada, cual) {
  const { libres, valores } = separa(args);
  const n = parseInt(valores["-n"] || "10", 10);
  const lineas = entrada || (libres[0] ? leer(libres[0]) : null);
  if (!lineas) { log(`${cual}: falta un archivo válido`, "mal"); return []; }
  return cual === "head" ? lineas.slice(0, n) : lineas.slice(-n);
}

function cmdWc(args, entrada) {
  const { libres } = separa(args);
  if (entrada) return [String(entrada.length)];
  const l = libres[0] ? leer(libres[0]) : null;
  if (!l) { log("wc: falta un archivo válido", "mal"); return []; }
  return [`${l.length} ${libres[0]}`];
}

/** Traduce una expresion regular basica a la sintaxis del motor de JavaScript. */
function aBRE(p) {
  const especiales = "{}()+?|";
  let r = "", i = 0;
  while (i < p.length) {
    const c = p[i];
    if (c === "\\" && i + 1 < p.length) {
      const sig = p[i + 1];
      r += especiales.includes(sig) ? sig : "\\" + sig;
      i += 2;
      continue;
    }
    r += especiales.includes(c) ? "\\" + c : c;
    i++;
  }
  return r;
}

function cmdGrep(args, entrada) {
  const { flags, libres, valores } = separa(args);
  const patron = quita(libres[0]);
  if (!patron) { log("grep: falta el patrón", "mal"); return []; }

  let banderas = flags.includes("-i") ? "i" : "";
  // Sin -E las llaves, el mas, el interrogante y la barra son literales, igual
  // que en el grep real: si el simulador los aceptara siempre, ensenaria a
  // escribir expresiones que fuera de aqui no funcionan.
  let fuente = flags.includes("-E") ? patron : aBRE(patron);
  if (flags.includes("-w")) fuente = "\\b(?:" + fuente + ")\\b";
  let re;
  try { re = new RegExp(fuente, banderas + "g"); }
  catch (e) { log("grep: la expresión regular no es válida", "mal"); return []; }

  // De donde se lee: del pipe, de los archivos nombrados o de un directorio con -r
  const objetivos = [];
  if (entrada) objetivos.push({ nombre: null, lineas: entrada });
  else {
    const rutas = libres.slice(1);
    if (flags.includes("-r")) {
      const base = resolver(rutas[0] || ".");
      for (const k of bajo(base)) if (fs[k].tipo === "file") objetivos.push({ nombre: k, lineas: fs[k].lineas });
    } else {
      for (const r of rutas) {
        const l = leer(r);
        if (!l) { log(`grep: ${r}: no existe`, "mal"); continue; }
        objetivos.push({ nombre: r, lineas: l });
      }
    }
  }
  if (objetivos.length === 0) { log("grep: falta el archivo donde buscar", "mal"); return []; }

  const varios = objetivos.length > 1;
  const salida = [];
  let total = 0;
  const ctxA = parseInt(valores["-C"] || valores["-A"] || "0", 10);
  const ctxB = parseInt(valores["-C"] || valores["-B"] || "0", 10);

  for (const o of objetivos) {
    const marcadas = [];
    o.lineas.forEach((l, i) => {
      re.lastIndex = 0;
      const hay = re.test(l);
      if (hay !== flags.includes("-v")) marcadas.push(i);
    });
    total += marcadas.length;
    if (flags.includes("-l")) { if (marcadas.length) salida.push(o.nombre); continue; }
    if (flags.includes("-c")) { salida.push((varios && o.nombre ? o.nombre + ":" : "") + marcadas.length); continue; }

    const mostrar = new Set();
    for (const i of marcadas) for (let j = i - ctxB; j <= i + ctxA; j++) if (j >= 0 && j < o.lineas.length) mostrar.add(j);
    [...mostrar].sort((a, b) => a - b).forEach((i) => {
      let texto = o.lineas[i];
      if (flags.includes("-o")) {
        re.lastIndex = 0;
        const trozos = texto.match(re) || [];
        trozos.forEach((t) => salida.push(t));
        return;
      }
      if (flags.includes("-n")) texto = (i + 1) + ":" + texto;
      if (varios && o.nombre && !flags.includes("-h")) texto = o.nombre + ":" + texto;
      salida.push(texto);
    });
  }
  if (flags.includes("-c") && !varios && salida.length === 0) return [String(total)];
  return salida;
}

function cmdFind(args) {
  const { flags, libres, valores } = separa(args);
  // find lleva sus propias condiciones, que separa() no entiende: se releen aqui
  const cond = { nombre: null, tipo: null, size: null, mmin: null, mtime: null };
  for (let i = 0; i < args.length; i++) {
    if (args[i] === "-name" || args[i] === "-iname") cond.nombre = { patron: quita(args[++i]), i: args[i - 1] === "-iname" };
    else if (args[i] === "-type") cond.tipo = args[++i];
    else if (args[i] === "-size") cond.size = args[++i];
    else if (args[i] === "-mmin") cond.mmin = args[++i];
    else if (args[i] === "-mtime") cond.mtime = args[++i];
  }
  // La ruta es el primer argumento, si no empieza por guion. Buscarla entre los
  // libres tomaria por ruta el valor de una condicion, por ejemplo el +5 de -size.
  const inicio = args[0] && !args[0].startsWith("-") ? args[0] : ".";
  const base = resolver(inicio);
  if (base === null || !existe(base)) { log(`find: ${inicio}: no existe`, "mal"); return []; }

  const aRegex = (p) => new RegExp("^" + p.replace(/[.+^${}()|\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".") + "$", cond.nombre.i ? "i" : "");
  const ahora = Date.now();
  const salida = [];
  for (const k of bajo(base)) {
    const e = fs[k];
    const nombre = k.split("/").pop();
    if (cond.tipo === "f" && e.tipo !== "file") continue;
    if (cond.tipo === "d" && e.tipo !== "dir") continue;
    if (cond.nombre && !aRegex(cond.nombre.patron).test(nombre)) continue;
    if (cond.mmin !== null) {
      const min = (ahora - e.fecha) / 60000;
      const v = parseInt(cond.mmin.replace(/[+-]/, ""), 10);
      if (cond.mmin.startsWith("-") ? !(min < v) : !(min > v)) continue;
    }
    if (cond.mtime !== null) {
      const dias = (ahora - e.fecha) / 86400000;
      const v = parseInt(cond.mtime.replace(/[+-]/, ""), 10);
      if (cond.mtime.startsWith("-") ? !(dias < v) : !(dias > v)) continue;
    }
    if (cond.size !== null) {
      const lineas = e.lineas ? e.lineas.length : 0;
      const v = parseInt(cond.size.replace(/[+-kM]/g, ""), 10);
      if (cond.size.startsWith("+") ? !(lineas > v) : !(lineas < v)) continue;
    }
    salida.push("~/pruebas" + (k ? "/" + k : ""));
  }
  return salida;
}

function cmdSort(args, entrada) {
  const { flags, libres, valores } = separa(args);
  let lineas = entrada || (libres[0] ? leer(libres[0]) : null);
  if (!lineas) { log("sort: falta lo que hay que ordenar", "mal"); return []; }
  const sep = valores["-t"];
  const campo = valores["-k"] ? parseInt(valores["-k"], 10) : null;
  const num = flags.includes("-n") || (valores["-k"] || "").includes("n");
  const clave = (l) => {
    if (!campo) return l.trim();
    const partes = sep ? l.split(sep) : l.trim().split(/\s+/);
    return (partes[campo - 1] || "").trim();
  };
  const ordenadas = lineas.slice().sort((a, b) => {
    const x = clave(a), y = clave(b);
    if (num) return (parseFloat(x) || 0) - (parseFloat(y) || 0);
    return x.localeCompare(y);
  });
  if (flags.includes("-r")) ordenadas.reverse();
  return ordenadas;
}

function cmdUniq(args, entrada) {
  const { flags, libres } = separa(args);
  const lineas = entrada || (libres[0] ? leer(libres[0]) : null);
  if (!lineas) { log("uniq: falta lo que hay que revisar", "mal"); return []; }
  const salida = [];
  let previa = null, cuenta = 0;
  const volcar = () => {
    if (previa === null) return;
    salida.push(flags.includes("-c") ? `${String(cuenta).padStart(7)} ${previa}` : previa);
  };
  for (const l of lineas) {
    if (l === previa) { cuenta++; continue; }
    volcar();
    previa = l; cuenta = 1;
  }
  volcar();
  return salida;
}

/* ---------- ejecutor con pipes ---------- */
function ejecutarTramo(linea, entrada) {
  const partes = linea.trim().match(/'[^']*'|"[^"]*"|\S+/g) || [];
  if (partes.length === 0) return entrada || [];
  const [cmd, ...args] = partes;
  switch (cmd) {
    case "ls": return cmdLs(args);
    case "cd": return cmdCd(args);
    case "cat": return cmdCat(args);
    case "head": return cmdHeadTail(args, entrada, "head");
    case "tail": return cmdHeadTail(args, entrada, "tail");
    case "wc": return cmdWc(args, entrada);
    case "grep": return cmdGrep(args, entrada);
    case "find": return cmdFind(args);
    case "sort": return cmdSort(args, entrada);
    case "uniq": return cmdUniq(args, entrada);
    case "help": AYUDA.forEach((l) => log(l, "nota")); return [];
    case "clear": $("consola").querySelectorAll(".log").forEach((l) => l.remove()); return [];
    default:
      log(`${cmd}: no disponible aquí. Escribe "help" para ver la lista.`, "mal");
      return [];
  }
}

function ejecutar(linea) {
  if (!linea.trim()) return;
  log("$ " + linea, "eco");
  let entrada = null;
  for (const tramo of linea.split("|")) {
    entrada = ejecutarTramo(tramo, entrada);
  }
  // Un limite alto pero real: volcar diez mil lineas cuelga el navegador y no
  // ensena nada, y en una terminal de verdad se resuelve con head o con grep.
  const salida = entrada || [];
  if (salida.length > 200) {
    salida.slice(0, 200).forEach((l) => log(l));
    log(`… ${salida.length - 200} líneas más. Afina la búsqueda o usa head.`, "nota");
  } else {
    salida.forEach((l) => log(l));
  }
}

/* ============================================================
   OBJETIVOS Y PANEL
   ============================================================ */
function objetivos() {
  return [
    { campo: "lugar", objetivo: "Encuentra el punto de encuentro",
      texto: "El punto de encuentro está escrito en un informe. Búscalo por esas mismas palabras en toda la unidad." },
    { campo: "hora", objetivo: "Encuentra la hora de salida",
      texto: "La hora aparece junto a la placa del vehículo. La placa son dos letras, un guion y cuatro dígitos." },
    { campo: "informante", objetivo: "Identifica al informante",
      texto: "Alguien copió un archivo a la unidad hace unos minutos. El nombre del archivo lo delata." },
    { campo: "camara", objetivo: "Señala la cámara que más lo vio",
      texto: "En los registros de cámaras, cuenta cuál grabó esa placa más veces." },
  ];
}

const CAMPOS = [
  { id: "lugar", etiqueta: "Punto de encuentro", pista: "El nombre tal cual aparece" },
  { id: "hora", etiqueta: "Hora de salida", pista: "Formato hh:mm" },
  { id: "informante", etiqueta: "Informante", pista: "Sólo el nombre" },
  { id: "camara", etiqueta: "Cámara", pista: "Por ejemplo camara-07" },
];

function pintarCampos() {
  const cont = $("campos");
  cont.innerHTML = "";
  for (const c of CAMPOS) {
    const d = document.createElement("div");
    d.className = "campo" + (resueltos[c.id] ? " ok" : "");
    d.innerHTML = `<label>${c.etiqueta}</label><input id="in-${c.id}" autocomplete="off"${resueltos[c.id] ? " disabled" : ""}><span class="pista">${c.pista}</span>`;
    cont.appendChild(d);
    if (resueltos[c.id]) $("in-" + c.id).value = caso[c.id];
  }
}

const normal = (s) => (s || "").trim().toLowerCase().replace(/\s+/g, " ");

function descifrar() {
  let fallos = 0;
  for (const c of CAMPOS) {
    if (resueltos[c.id]) continue;
    const val = normal($("in-" + c.id).value);
    if (!val) continue;
    if (val === normal(caso[c.id])) {
      resueltos[c.id] = true;
      log("✓ dato confirmado: " + c.etiqueta.toLowerCase(), "ok");
    } else {
      fallos++;
      $("in-" + c.id).parentElement.classList.add("mal");
    }
  }
  $("aviso").textContent = fallos ? "Ese dato no cuadra con la unidad. Vuelve a buscarlo." : "";
  pintarCampos();
  revisar();
}

function revisar() {
  const lista = objetivos();
  while (paso < lista.length && resueltos[lista[paso].campo]) paso++;
  pintar();
  if (Object.values(resueltos).every(Boolean)) terminar();
}

let ultimoAnuncio = -1;

function pintar() {
  const lista = objetivos();
  $("goal").textContent = paso < lista.length ? lista[paso].objetivo : "Caso cerrado";
  $("counter").textContent = `${Math.min(paso + 1, lista.length)} / ${lista.length}`;
  $("dots").innerHTML = "";
  lista.forEach((_, i) => {
    const d = document.createElement("span");
    d.className = "dot" + (i < paso ? " done" : i === paso ? " cur" : "");
    $("dots").appendChild(d);
  });
  // El objetivo no tiene ventana propia: se anuncia en la terminal cuando
  // cambia, que es donde el estudiante ya esta mirando.
  if (paso !== ultimoAnuncio && paso < lista.length) {
    ultimoAnuncio = paso;
    log("");
    log(`[${paso + 1}/${lista.length}] ${lista[paso].texto}`, "nota");
  }
}

function pintarNota() {
  $("riddle-p").innerHTML =
    `Si fallas, la baticomputadora es mía.<br><br>` +
    `Cuatro datos te delatan: <b>dónde</b>, <b>cuándo</b>, <b>quién</b> y <b>cuánto</b>. ` +
    `Los escondí en esta unidad. Ninguno donde mirarías primero.`;
  // Interrogaciones sueltas, colocadas al azar detras del texto.
  const zona = $("interros");
  if (!zona) return;
  zona.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const q = document.createElement("span");
    q.textContent = "?";
    q.style.left = entero(4, 88) + "%";
    q.style.top = entero(6, 78) + "%";
    q.style.fontSize = entero(9, 22) + "px";
    q.style.animationDelay = (i * 0.7).toFixed(1) + "s";
    zona.appendChild(q);
  }
}

function terminar() {
  $("fin-p").textContent =
    `${caso.lugar}, a las ${caso.hora}. Lo entregó ${caso.informante} y la ${caso.camara} lo grabó ` +
    `más veces que ninguna. Cuatro búsquedas, cuatro herramientas: grep, una expresión regular, find y sort.`;
  $("fin").hidden = false;
}

/* ============================================================
   ENTRADA
   ============================================================ */
let tecleado = "";
const ocupado = () => !$("fin").hidden || !$("portada").hidden;

function enfocar() {
  const t = $("pegar");
  if (t && t.focus) t.focus({ preventScroll: true });
}

document.addEventListener("keydown", (ev) => {
  if (ocupado()) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (ev.key === "Enter") {
    const linea = tecleado;
    tecleado = "";
    $("tecleado").textContent = "";
    ejecutar(linea);
    return;
  }
  if (ev.key === "Backspace") tecleado = tecleado.slice(0, -1);
  else if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey) tecleado += ev.key;
  else return;
  ev.preventDefault();
  $("tecleado").textContent = tecleado;
});

document.addEventListener("paste", (ev) => {
  if (ocupado()) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  const datos = ev.clipboardData || window.clipboardData;
  if (!datos) return;
  ev.preventDefault();
  tecleado += (datos.getData("text") || "").split(/\r?\n/)[0];
  $("tecleado").textContent = tecleado;
  const t = $("pegar");
  if (t) t.value = "";
});

$("desk").addEventListener("click", (ev) => {
  if (ev.target.tagName !== "INPUT") enfocar();
});

function reiniciar() {
  nuevoCaso();
  tecleado = "";
  $("tecleado").textContent = "";
  $("consola").querySelectorAll(".log").forEach((l) => l.remove());
  $("aviso").textContent = "";
  $("ps1").textContent = "~/pruebas $";
  $("fin").hidden = true;
  $("portada").hidden = false;
  ultimoAnuncio = -1;
  pintarNota();
  pintarCampos();
  log(MURCIELAGO, "arte");
  log("Unidad del sospechoso montada en ~/pruebas.", "nota");
  log("Escribe help para ver los comandos disponibles.", "nota");
  pintar();
}

$("descifrar").addEventListener("click", descifrar);
$("play").addEventListener("click", () => { $("portada").hidden = true; enfocar(); });
$("restart").addEventListener("click", reiniciar);
$("fin-again").addEventListener("click", reiniciar);
$("fin-exit").addEventListener("click", () => window.parent.postMessage({ action: "close-simulator" }, "*"));

/* Si los marcos no estan (todavia no se han subido, o fallo la descarga), el
   simulador cae a paneles planos en vez de quedarse con dos huecos negros. */
(function comprobarMarcos() {
  if (typeof Image === "undefined") return;
  let pendientes = 2, fallos = 0;
  const revisar = () => {
    if (--pendientes === 0 && fallos) document.body.classList.add("sin-marco");
  };
  for (const src of ["marco-batcomputadora.webp", "marco-unidad.webp"]) {
    const img = new Image();
    img.onload = revisar;
    img.onerror = () => { fallos++; revisar(); };
    img.src = src;
  }
})();
