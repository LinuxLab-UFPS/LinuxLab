# LinuxLab en Podman (servidor de la U)
#
# Adaptado a podman-compose 1.0.6 rootless:
#  · puertos publicos via PORT_0..PORT_9 (asignados por la infraestructura)
#  · red interna pre-creada con `podman network create --internal linuxlab_internal`
#  · sin cap_add/security_opt (rootless no los permite; los fallbacks del
#    entrypoint del entorno cubren hidepid/cgroups)
#  · depends_on simple (sin condition: service_healthy): migrate con retry
#  · image: en vez de build: — las imagenes se construyen FUERA del servidor
#    (deploy/build-local.sh) y se cargan con podman load (deploy/deploy-server.sh)
#
# Uso (desde la raiz del repo, en el servidor):
#   podman network create --internal linuxlab_internal
#   podman-compose -p linuxlab -f deploy/compose.podman.yml up -d

x-logging: &logging
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }

x-health-pg: &health-pg
  test: ["CMD-SHELL", "pg_isready -U linuxlab -d linuxlab -h localhost"]
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 10s

x-health-backend: &health-backend
  test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  migrate:
    image: linuxlab-backend:latest
    container_name: linuxlab-migrate
    networks: [internal]
    depends_on:
      - postgres
    env_file: ../backend/.env
    # One-shot con reintento: postgres puede tardar en aceptar conexiones y
    # podman-compose 1.0.6 no soporta condition: service_healthy.
    entrypoint:
      [
        "sh", "-c",
        "i=0; until npx prisma migrate deploy; do i=$$((i+1)); [ $$i -ge 20 ] && echo '[migrate] no se pudo aplicar tras 20 intentos' && exit 1; echo '[migrate] postgres no listo, reintentando...'; sleep 3; done",
      ]
    logging: *logging

  init:
    image: alpine:3
    container_name: linuxlab-init
    # Necesita salida a internet en el primer arranque (apk add).
    networks: [external]
    volumes:
      - ../scripts/docker:/scripts:ro
      - ssh_keys:/ssh
    entrypoint: ["/scripts/init-env.sh"]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    container_name: linuxlab-postgres
    networks: [internal]
    mem_limit: 192m
    environment:
      POSTGRES_USER: linuxlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:-linuxlab}
      POSTGRES_DB: linuxlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: *health-pg
    restart: unless-stopped
    logging: *logging

  entorno:
    image: linuxlab-entorno:latest
    hostname: linuxlab
    container_name: linuxlab-entorno
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    cpu_shares: 512
    depends_on:
      - init
    volumes:
      - ssh_keys:/ssh:ro
      - entorno_home:/home
      - entorno_etc:/var/lib/linuxlab
    restart: unless-stopped
    logging: *logging

  backend:
    image: linuxlab-backend:latest
    container_name: linuxlab-backend
    networks: [internal, external]
    mem_limit: 256m
    cpu_shares: 1024
    # Loopback y no 0.0.0.0: el proxy lo alcanza por la red de contenedores y
    # deploy-server.sh sigue pudiendo consultar /api/health, pero desde fuera
    # del servidor este puerto ya no existe.
    ports:
      - "127.0.0.1:${PORT_1:-3000}:3000"
    env_file: ../backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SSH_HOST: entorno
      SSH_USER: labadmin
      SSH_KEY_PATH: /ssh/ssh_key
      JWT_SECRET: ${JWT_SECRET:-linuxlab-jwt-secret-2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      - postgres
      - migrate
      - init
    volumes:
      - ssh_keys:/ssh:ro
    healthcheck: *health-backend
    restart: unless-stopped
    logging: *logging

  frontend:
    image: linuxlab-frontend:latest
    container_name: linuxlab-frontend
    networks: [external]
    mem_limit: 96m
    cpu_shares: 256
    environment:
      # La URL publica del backend se incrusta en el build (NEXT_PUBLIC_*):
      # se fija en local con deploy/build-local.sh --url ANTES de compilar.
      # Este BACKEND_URL es para las llamadas server-side de Next dentro de la red.
      BACKEND_URL: http://backend:3000
      # Debe coincidir con el JWT_SECRET del backend: el middleware edge
      # verifica las sesiones que firma el backend.
      JWT_SECRET: ${JWT_SECRET:-linuxlab-jwt-secret-2026}
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging

  # Da una sola URL publica a todo: reparte por ruta entre el frontend y el
  # backend, asi que la infraestructura solo tiene que asignar PORT_0. Vive en
  # `external` porque ahi estan los dos a los que reenvia.
  proxy:
    image: docker.io/library/caddy:2-alpine
    container_name: linuxlab-proxy
    networks: [external]
    mem_limit: 64m
    cpu_shares: 256
    ports:
      - "${PORT_0:-3001}:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *logging

networks:
  # Pre-creada con --internal: sin egress ni puertos publicados. Solo viven
  # aqui postgres y el entorno; el backend (en ambas redes) es su unico cliente.
  internal:
    external: true
    name: linuxlab_internal
  external:
    name: linuxlab_external

volumes:
  pgdata:
  ssh_keys:
  entorno_home:
  entorno_etc:
